version: '3.8'

services:
  ad-platform:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ad-platform
    restart: always
    ports:
      - "8000:8000"
    environment:
      - TERRAFORM_DRY_RUN=${TERRAFORM_DRY_RUN:-true}
      - PROVISIONING_MODE=${PROVISIONING_MODE:-poc}
      - ARM_SUBSCRIPTION_ID
      - ARM_TENANT_ID
      - ARM_CLIENT_ID
      - ARM_CLIENT_SECRET
    volumes:
      - ./backend/runs:/app/backend/runs
      - ad_data:/app/backend/data

volumes:
  ad_data:
