<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AD as a Service</title>
<style>
:root{--bg:#f5f7fa;--surface:#fff;--line:#e4e8ee;--ink:#101828;--slate:#667085;--muted:#98a2b3;--navy:#0f1f3d;--blue:#2563eb;--blue2:#1d4ed8;--blue-soft:#eaf0ff;--green:#15803d;--green-soft:#e7f6ec;--amber:#b45309;--amber-soft:#fff4e0;--red:#b91c1c;--red-soft:#fdecec;--r:10px;--sh:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.08);--sans:Inter,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:var(--sans);color:var(--ink);background:var(--bg);font-size:14.5px;line-height:1.5;display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:antialiased}
a{color:var(--blue);text-decoration:none}a:hover{text-decoration:underline}
header{height:60px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 20px;gap:14px;flex:none;width:100%;max-width:100%}
.brand{font-weight:800;font-size:17px;color:var(--navy);white-space:nowrap;cursor:pointer;letter-spacing:-.01em}.brand span{font-weight:500;color:var(--slate);margin-left:7px;font-size:13px}
.spacer{flex:1}
.hnav{display:flex;gap:2px}.hnav a{color:var(--slate);font-size:14px;font-weight:500;padding:7px 12px;border-radius:8px}.hnav a.on,.hnav a:hover{background:#f1f4f9;color:var(--navy);text-decoration:none}
.link{all:unset;cursor:pointer;color:var(--slate);font-size:14px;font-weight:500;padding:7px 12px;border-radius:8px;white-space:nowrap}.link:hover{background:#f1f4f9;color:var(--navy);text-decoration:none}
.link.cta{background:var(--navy);color:#fff}.link.cta:hover{background:#1a2f5a}
#who{font-size:13px;color:var(--slate);white-space:nowrap;max-width:230px;overflow:hidden;text-overflow:ellipsis}#who b{color:var(--ink);font-weight:600}
#app{flex:1;min-height:0;display:flex}
.page{flex:1;overflow:auto;padding:32px 40px}
.site{flex:1;overflow:auto}
.wrap{max-width:1120px;margin:0 auto;padding:48px 36px}
.chat{flex:1;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:12px;background:#fafbfc}
.msg{max-width:90%;padding:10px 14px;border-radius:14px;font-size:14px;line-height:1.5;white-space:pre-wrap}
.msg.u{align-self:flex-end;background:var(--blue);color:#fff;border-bottom-right-radius:4px}.msg.a{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px;box-shadow:var(--sh)}
.msg .mini{margin-top:10px;border-top:1px solid var(--line);padding-top:10px;font-size:12.5px}
.chat-in{border-top:1px solid var(--line);padding:12px;display:flex;gap:8px;background:var(--surface)}.chat-in input{flex:1}
.sugg{padding:10px 14px;display:flex;flex-wrap:wrap;gap:6px;border-top:1px solid var(--line);background:var(--surface)}
.sugg button{all:unset;cursor:pointer;font-size:12.5px;border:1px solid var(--line);border-radius:999px;padding:4px 11px;color:var(--navy);background:#fff}.sugg button:hover{border-color:var(--blue);color:var(--blue)}
h1{margin:0 0 12px;font-size:40px;font-weight:800;color:var(--navy);line-height:1.1;letter-spacing:-.02em}
h2{margin:0 0 4px;font-size:24px;font-weight:700;color:var(--navy);letter-spacing:-.01em}
.sub{color:var(--slate);margin:0 0 22px;font-size:15px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;margin-bottom:18px;box-shadow:var(--sh)}
.card h3{margin:0 0 12px;font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--slate);font-weight:700}
.grid{display:grid;gap:18px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr 1fr}.g4{grid-template-columns:repeat(4,1fr)}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--slate);padding:10px 12px;border-bottom:1px solid var(--line);font-weight:700}
td{padding:11px 12px;border-bottom:1px solid #eef1f5;vertical-align:middle}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}tr.click:hover td{background:#f7f9fc}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;background:#f1f4f9;color:var(--slate)}
.chip.ok{background:var(--green-soft);color:var(--green)}.chip.warn{background:var(--amber-soft);color:var(--amber)}.chip.bad{background:var(--red-soft);color:var(--red)}.chip.run{background:var(--blue-soft);color:var(--blue)}
.btn{all:unset;cursor:pointer;background:var(--blue);color:#fff;padding:9px 16px;border-radius:8px;font-weight:600;font-size:14px;white-space:nowrap;text-align:center;line-height:1.2}
.btn:hover{background:var(--blue2);text-decoration:none}.btn.ghost{background:var(--surface);color:var(--navy);border:1px solid var(--line)}.btn.ghost:hover{background:#f7f9fc;border-color:#cfd6e0}
.btn.red{background:var(--surface);color:var(--red);border:1px solid #f3c6c6}.btn.red:hover{background:var(--red-soft)}.btn.sm{padding:5px 11px;font-size:12.5px;border-radius:6px}.btn.lg{padding:12px 22px;font-size:15px;border-radius:10px}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.kv{display:grid;grid-template-columns:150px 1fr;gap:8px 14px}.kv b{color:var(--slate);font-weight:500}
input,select{font:inherit;padding:9px 11px;border:1px solid #cfd6e0;border-radius:8px;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:3px solid rgba(37,99,235,.18);border-color:var(--blue)}
input[readonly]{background:#f7f9fc;color:var(--slate)}
label{display:block;font-size:12.5px;font-weight:600;color:var(--slate);margin:12px 0 5px}
pre{background:#0f1f3d;color:#dbe4f3;border-radius:8px;padding:14px;font-size:12.5px;line-height:1.55;overflow:auto;max-height:320px;margin:0}
.pill{display:inline-block;background:#f1f4f9;border-radius:999px;padding:2px 10px;margin:0 6px 6px 0;font-size:12.5px;color:var(--ink)}
.steps{list-style:none;padding:0;margin:0}.steps li{display:grid;grid-template-columns:20px 1fr;gap:10px;padding:6px 0}
.dot{width:12px;height:12px;border-radius:50%;background:var(--line);margin-top:5px}.dot.done{background:var(--green)}.dot.run{background:var(--blue);animation:p 1s infinite}.dot.error{background:var(--red)}
@keyframes p{50%{opacity:.35}}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{display:inline-block;animation:spin 1s linear infinite}
.log{font-size:12.5px;color:var(--slate)}.err{color:var(--red);font-size:13px}.warn{color:var(--amber);font-size:13px}.empty{color:var(--slate)}
.note{background:var(--amber-soft);border:1px solid #f3dcaa;color:#7a4b06;border-radius:8px;padding:10px 14px;font-size:13.5px;margin:12px 0}
.info{background:var(--blue-soft);border:1px solid #c7d7fb;color:#1e3a8a;border-radius:8px;padding:10px 14px;font-size:13.5px;margin:12px 0}
.bar{height:8px;background:#eef1f5;border-radius:999px;overflow:hidden}.bar i{display:block;height:100%;background:var(--blue);border-radius:999px}.bar i.warn{background:var(--amber)}.bar i.bad{background:var(--red)}
.diff{font:13px/1.8 ui-monospace,Menlo,monospace}.diff .a{color:var(--green)}.diff .r{color:var(--red)}.diff .c{color:var(--amber)}
/* shell */
.shell{flex:1;min-height:0;display:grid;grid-template-columns:224px minmax(0,1fr) auto;width:100%;max-width:100%;overflow:hidden}
.shell.plain{grid-template-columns:minmax(0,1fr) auto;width:100%;max-width:100%;overflow:hidden}
.side{background:var(--surface);border-right:1px solid var(--line);padding:14px 10px;overflow:auto}
.side .grp{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:18px 12px 6px}
.side a{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border-radius:8px;color:var(--slate);font-weight:500;margin-bottom:2px}
.side a:hover{background:#f1f4f9;color:var(--navy);text-decoration:none}.side a.on{background:var(--blue-soft);color:var(--blue);font-weight:600}
.side .badge{background:var(--blue);color:#fff;font-size:11px;border-radius:999px;padding:1px 7px}
.side a.sub{padding:6px 12px 6px 28px;font-size:13.5px;font-weight:500;color:var(--slate)}.side a.sub.on{color:var(--blue);font-weight:700;background:none}.side .locked{padding:6px 12px;color:var(--muted);font-size:13px}
.content{overflow:auto;padding:30px 36px;width:100%}.content.narrow{max-width:980px;width:100%;margin:0 auto}
.dock{width:380px;border-left:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;min-height:0}
.dock .head{padding:16px 20px;border-bottom:1px solid var(--line)}.dock .head b{font-size:15px;color:var(--navy)}.dock .head small{display:block;color:var(--slate);margin-top:2px;font-size:12.5px}
.phead{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:22px}.phead h1{font-size:26px;margin:0;font-weight:700}.phead .sub{margin:4px 0 0}
.tenant{font:inherit;font-weight:600;color:var(--navy);border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:#fff}
.tenant-name{font-weight:600;color:var(--navy);padding-left:14px;border-left:1px solid var(--line)}
.user{display:flex;flex-direction:column;line-height:1.15;text-align:right;padding-left:6px}.user b{font-size:13px;color:var(--ink)}.user small{color:var(--slate);font-size:11.5px}
.link.on{background:var(--blue-soft);color:var(--blue)}
.stepper{list-style:none;display:flex;gap:8px;padding:0;margin:0 0 24px}
.stepper li{display:flex;align-items:center;gap:8px;color:var(--muted);font-weight:600;font-size:13px}
.stepper li span{width:24px;height:24px;border-radius:50%;background:#eef1f5;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;font-size:12px}
.stepper li.on{color:var(--navy)}.stepper li.on span{background:var(--navy);color:#fff}.stepper li.done{color:var(--green)}.stepper li.done span{background:var(--green-soft);color:var(--green)}
.stepper li+li::before{content:"";width:28px;height:1px;background:var(--line);margin-right:8px}
.card.flush{padding:0;overflow:hidden}.card.flush table th:first-child,.card.flush table td:first-child{padding-left:18px}
td.r{text-align:right}tr.sel td{background:var(--blue-soft)}
.big{font-size:22px;font-weight:700;color:var(--navy)}
.check{list-style:none;padding:0;margin:0}.check li{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #eef1f5}.check li:last-child{border:0}
.check li span{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:inline-flex;align-items:center;justify-content:center;font-size:12px;color:#fff}.check li.done span{background:var(--green);border-color:var(--green)}.check li.done a{color:var(--slate);text-decoration:line-through}
.act{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid #eef1f5;color:var(--ink)}.act:last-child{border:0}.act:hover{text-decoration:none;background:#fafbfc}.act b{color:var(--navy)}
.empty-state{color:var(--slate);padding:18px;text-align:center}
.ck{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500;color:var(--ink);margin:6px 0;text-transform:none;letter-spacing:0}
.metrics{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.metrics span{display:inline-flex;flex-direction:column;background:#f1f4f9;border-radius:6px;padding:3px 8px;line-height:1.2}.metrics small{font-size:10px;color:var(--slate);text-transform:uppercase;letter-spacing:.05em}.metrics b{font-size:12.5px;color:var(--navy)}
#toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,10px);background:var(--navy);color:#fff;padding:10px 16px;border-radius:8px;font-size:13.5px;opacity:0;transition:.2s;pointer-events:none;z-index:20}#toast.show{opacity:1;transform:translate(-50%,0)}
/* page head & stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--sh)}
.stat b{display:block;font-size:26px;font-weight:800;color:var(--navy);line-height:1.1;letter-spacing:-.02em}.stat small{color:var(--slate);font-size:12.5px;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.stat .d{color:var(--slate);font-size:13px;margin-top:4px}
footer.site{border-top:1px solid var(--line);color:var(--muted);font-size:12.5px;padding:22px 32px;text-align:center}
.auth{max-width:460px;margin:36px auto}
.auth input{width:100%}
/* wizard */
.wiz{display:grid;grid-template-columns:240px 1fr;gap:28px}
.wiz ol{list-style:none;padding:0;margin:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px;box-shadow:var(--sh)}
.wiz ol li{padding:9px 12px;border-radius:8px;color:var(--slate);font-weight:500}
.wiz ol li.on{color:var(--navy);font-weight:700;background:var(--blue-soft)}.wiz ol li.done{color:var(--green)}
.wiz h3{font-size:16px;text-transform:none;letter-spacing:0;color:var(--navy);margin-bottom:14px}
.sol{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.sol div{border:1px solid var(--line);border-radius:var(--r);padding:16px;cursor:pointer;background:var(--surface)}.sol div:hover{border-color:#cfd6e0}.sol div.on{border-color:var(--blue);background:var(--blue-soft);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.sol b{display:block;color:var(--navy);margin-bottom:4px;font-size:15px}.sol small{color:var(--slate)}
.creds{font-size:12.5px;color:var(--slate);margin-top:22px;border-top:1px solid var(--line);padding-top:14px}.creds b{color:var(--ink)}.creds table td{padding:5px 8px;font-size:12.5px;border:0}
</style>
</head>
<body>
<header id="hdr"></header>
<div id="app"></div>

<script>
/* ============================== content ============================== */
const REGISTRY={gendf:"GenDF","readygo-retail":"ReadyGo Retail","readygo-finance":"ReadyGo Finance","readygo-healthcare":"ReadyGo Healthcare","transaction-enhancer":"Transaction Enhancer"};
const WORK_INFO={gendf:"Integrates datasets into one governed foundation","readygo-retail":"Orders, stores, products and promotions","readygo-finance":"Transactions, accounts and balances","readygo-healthcare":"Patients, encounters and billing records","transaction-enhancer":"Recommendations on each transaction as it happens"};
const workLabel=d=>`${REGISTRY[d]||d} <span class="log">· ${WORK_INFO[d]||""}</span>`;
const REGIONS=["eastus2","westus3","centralus"];
const ENVS=[{id:"prod1",label:"Production (prod1)"},{id:"test1",label:"Testing / QA (test1)"},{id:"dev1",label:"Development / POC (dev1)"}];
const MAX_SPEND=50000;
const OPERATOR="demetrius@alidainc.com"; // every account is managed by an Alida admin; clients are users only
const HRS={DATA:2,PRODUCE:8,EXPLORE:4,GENERATE:6};
const STACK_JOBS=["Check the order","Create dedicated environment","Create dedicated database","Create dedicated compute","Configure services","Start AD","Verify"];
const SOL=[
 {id:"data-foundation",name:"Produce a Data Foundation",blurb:"Integrated, peered datasets with rich metadata. The default use case.",domains:["gendf"],verbs:["DATA","PRODUCE","EXPLORE","GENERATE"]},
 {id:"explore-industry",name:"Explore Industry Datasets",blurb:"Subscribe to curated datasets and explore them. No Produce.",domains:["gendf","readygo-retail"],verbs:["EXPLORE"]},
 {id:"byod",name:"Explore Your Own Data (BYOD)",blurb:"Import your own datasets and explore them.",domains:["gendf"],verbs:["DATA","EXPLORE"]},
 {id:"transaction",name:"Add Per-Transaction Value",blurb:"JIT transaction processing with recommendations per transaction.",domains:["gendf","transaction-enhancer"],verbs:["PRODUCE"]}
];
const DEFAULTS={region:"eastus2",env:"prod1",spend:5000,storage:500};
const WIZ=["Account","Use case","Stack","Users","Review & confirm"];

/* ============================== backend sync & state ============================== */
const KEY="adaas-proto-v7";
function seed(){
  return { v:7, session:null, acting:null, provisioning:null, onbs:{}, seq:{so:1,co:1,wo:1,ds:3}, ui:{cfgErr:"",onbErr:"",orderId:null,editing:null,authErr:"",dock:true},
    users:[
      {email:"demetrius@alidainc.com",name:"Demetrius",password:"ad",accountId:null,role:"staff",access:{catalogs:[]}},
      {email:"staff@alidainc.com",name:"Alida staff",password:"ad",accountId:null,role:"staff",access:{catalogs:[]}},
      {email:"bill@alidainc.com",name:"Bill Sequeira",password:"ad",accountId:"alida-internal",role:"user",access:{catalogs:["gendf","readygo-retail"]}},
      {email:"dhananjay@alidainc.com",name:"Dhananjay Goel",password:"ad",accountId:"alida-internal",role:"user",access:{catalogs:["readygo-retail"]}},
      {email:"maya@mercy.org",name:"Maya Chen",password:"ad",accountId:"mercy-clinics",role:"user",access:{catalogs:["gendf"]}},
      {email:"raj@mercy.org",name:"Raj Patel",password:"ad",accountId:"mercy-clinics",role:"user",access:{catalogs:["gendf"]}}],
    accounts:[
      {id:"alida-internal",name:"Alida Internal (first client)",solution:"data-foundation",region:"eastus2",env:"dev1",tenancy:"dedicated",management:"fully",status:"ready",
        domains:["gendf","readygo-retail"],resources:{spendLimitUsd:5000,storageGb:500},usage:{spendUsd:1840,computeHours:62},
        datasets:[{name:"retail_orders_2025",gb:12.4,src:"UC"},{name:"store_master",gb:0.3,src:"import"}],created:"2026-11-20"},
      {id:"mercy-clinics",name:"Mercy Clinics",solution:"data-foundation",region:"eastus2",env:"prod1",tenancy:"dedicated",management:"fully",status:"ready",
        domains:["gendf"],resources:{spendLimitUsd:12000,storageGb:1000},usage:{spendUsd:3100,computeHours:90},
        datasets:[{name:"encounters_2025",gb:40.2,src:"import"}],created:"2026-11-22"}],
    orders:[{id:"CO-0001",accountId:"alida-internal",kind:"provision",source:"staff",requestedBy:"demetrius@alidainc.com",status:"applied",created:"2026-11-20 09:12",validation:{ok:true,errors:[],warnings:[]},
      changes:[{op:"provision",target:"environment",value:"eastus2 · dev1 · dedicated · fully managed"},{op:"add",target:"domain",id:"gendf"},{op:"add",target:"domain",id:"readygo-retail"},{op:"add",target:"user",email:"bill@alidainc.com"},{op:"set",target:"access",email:"bill@alidainc.com",catalogs:["gendf","readygo-retail"]}],
      jobs:STACK_JOBS.map(n=>[n,"done"]),logs:[]}],
    works:[{id:"WO-0001",accountId:"alida-internal",by:"dhananjay@alidainc.com",verb:"PRODUCE",text:"Produce a data foundation from retail_orders_2025",status:"done",result:"2 datasets integrated into one foundation.",metrics:[["Rows","1.2M"],["Entities","14"],["Transformations","38"],["Quality","98%"],["Time","3m 20s"]],promoted:false}],
    audit:[{t:"2026-11-20 09:31",actor:"orchestrator",action:"config-order.applied",ref:"CO-0001"},{t:"2026-11-20 09:14",actor:"demetrius@alidainc.com",action:"sales-order.received",ref:"SO-0001"}],
    chats:{sales:[{r:"a",t:"Hi, I'm Configgy. I'll help you set up this client's account: the use case, who will use it, and where it runs. Ask me anything as you go."}],cfg:{},ad:{}}
  };
}
const store={get(){try{return localStorage.getItem(KEY);}catch(e){return null;}},set(v){try{localStorage.setItem(KEY,v);}catch(e){}},del(){try{localStorage.removeItem(KEY);}catch(e){}}};
function load(){ try{ const s=JSON.parse(store.get()); if(s&&s.v===7) return s; }catch(e){} return seed(); }
let S=load();
let _syncTimer=null;
function syncBackend(){
  if(!window.fetch) return;
  if(_syncTimer) clearTimeout(_syncTimer);
  _syncTimer=setTimeout(()=>{
    fetch('/api/state/sync',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({users:S.users,accounts:S.accounts,orders:S.orders,works:S.works})
    }).catch(()=>{});
  },350);
}
const save=()=>{ store.set(JSON.stringify(S)); syncBackend(); };

function mergeBackendState(d){
  if(!d) return;
  const maxNum=(arr,pfx)=>arr.reduce((m,x)=>{ const mt=String(x.id||"").match(new RegExp("^"+pfx+"-(\\d+)$")); return mt?Math.max(m,+mt[1]):m; },0);
  if(d.users && d.users.length){
    const prevUsers=S.users;
    S.users=d.users.map(u=>{
      const accountId=u.accountId||u.account_id||null;
      const role=u.role==="staff"?"staff":"user";
      const access=u.access&&Array.isArray(u.access.catalogs)?u.access:{catalogs:[]};
      const old=prevUsers.find(x=>x.email.toLowerCase()===u.email.toLowerCase());
      return Object.assign({},old||{},u,{accountId,role,access,password:u.password||old?.password||"welcome"});
    });
  }
  if(d.accounts && d.accounts.length){
    S.accounts=d.accounts.map(a=>Object.assign({},a,{
      tenancy:"dedicated",
      domains:Array.isArray(a.domains)?a.domains:["gendf"],
      resources:a.resources||{spendLimitUsd:5000,storageGb:500},
      usage:a.usage||{spendUsd:0,computeHours:0},
      datasets:Array.isArray(a.datasets)?a.datasets:[]
    }));
    if(S.acting&&!S.accounts.some(a=>a.id===S.acting)) S.acting=null;
  }
  if(d.orders && d.orders.length){
    d.orders.forEach(o=>{
      const idx=S.orders.findIndex(x=>x.id===o.id);
      if(idx>=0) S.orders[idx]=Object.assign(S.orders[idx],o);

function describe(c){
  if(c.op==="provision") return "provision environment: "+c.value;
  if(c.target==="domain") return (c.op==="add"?"+ ":"− ")+"work "+(REGISTRY[c.id]||c.id);
  if(c.target==="user") return (c.op==="add"?"+ ":"− ")+"user "+c.email;
  if(c.target==="resources") return "~ limits "+Object.entries(c.value).map(([k,v])=>`${{spendLimitUsd:"usage budget",storageGb:"storage GB"}[k]||k}=${v}`).join(", ");
  if(c.target==="access") return `~ access for ${c.email} · work: ${(c.catalogs||[]).map(x=>REGISTRY[x]||x).join(", ")||"none"}`;
  return JSON.stringify(c);
}
function validate(a,changes){
  const errors=[],warnings=[];
  const doms=new Set(a.domains||[]),usr=new Set(accountUsers(a).map(u=>u.email.toLowerCase()));
  if(!changes.length) errors.push("The order contains no changes.");
  for(const c of changes){
    if(c.target==="domain"){
      if(c.op==="add"){ if(!REGISTRY[c.id]) errors.push(`Work "${c.id}" is not in the registry.`); else if(doms.has(c.id)) warnings.push(`${c.id} already present.`); else doms.add(c.id); }
      else { if(!doms.has(c.id)) errors.push(`Work ${c.id} is not present.`); else doms.delete(c.id); }
    }
    else if(c.target==="user"){
      const em=(c.email||"").toLowerCase();
      if(!/^\S+@\S+\.\S+$/.test(em)) errors.push("Invalid email: "+c.email);
      else if(c.op==="add"){
        if(usr.has(em)) warnings.push(em+" is already a user.");
        else if(S.users.some(u=>u.email.toLowerCase()===em&&((u.accountId&&u.accountId!==a.id)||u.role==="staff"))) errors.push(em+" belongs to another account or is an Alida admin.");
        else usr.add(em);
      }
      else if(c.op==="remove"){ if(!usr.has(em)) errors.push(em+" is not a user."); else usr.delete(em); }
    }
    else if(c.target==="access"){
      const em=(c.email||"").toLowerCase();
      if(!usr.has(em)) errors.push(em+" is not a user.");
      else for(const x of (c.catalogs||[])) if(!doms.has(x)) errors.push(`Work ${x} is not in this account.`);
    }
    else if(c.target==="resources"){
      if(c.value.spendLimitUsd!=null){
        if(c.value.spendLimitUsd<=0) errors.push("Usage budget must be positive.");
        else if(c.value.spendLimitUsd>MAX_SPEND) errors.push(`Usage budget above policy maximum ($${MAX_SPEND.toLocaleString()}).`);
      }
      if(c.value.storageGb!=null && c.value.storageGb<=0) errors.push("Storage limit must be positive.");
    }
  }
  return {ok:!errors.length,errors,warnings};
}
function apply(a,changes){
  for(const c of changes){
    if(c.target==="domain"){
      if(c.op==="add"&&!a.domains.includes(c.id)) a.domains.push(c.id);
      if(c.op==="remove") a.domains=a.domains.filter(x=>x!==c.id);
    }
    else if(c.target==="user"){
      const em=(c.email||"").toLowerCase();
      const u=S.users.find(u=>u.email.toLowerCase()===em);
      if(c.op==="add"){
        if(u){ u.accountId=a.id; u.role="user"; }
        else S.users.push({email:em,name:em.split("@")[0],password:"welcome",accountId:a.id,role:"user",access:{catalogs:[]}});
      }
      if(c.op==="remove"&&u) S.users=S.users.filter(x=>x.email.toLowerCase()!==em);
    }
    else if(c.target==="resources") Object.assign(a.resources,c.value);
    else if(c.target==="access"){
      const em=(c.email||"").toLowerCase();
      const u=S.users.find(u=>u.email.toLowerCase()===em);
      if(u) u.access={catalogs:(c.catalogs||[]).slice()};
    }
  }
  for(const u of accountUsers(a)){
    u.access=u.access||{catalogs:[]};
    u.access.catalogs=u.access.catalogs.filter(x=>a.domains.includes(x));
  }
}
function createOrder(a,changes,source,opts={}){
  const v=validate(a,changes);

function parseConfig(text){
  const t=text.toLowerCase(); const ch=[]; let res=null;
  t.split(/\s+and\s+|,|;/).forEach(p=>{ let m;
    if(m=p.match(/add (?:the )?(?:domain|work)\s+(\S+)/)) ch.push({op:"add",target:"domain",id:m[1]});
    else if(m=p.match(/(?:remove|drop|delete) (?:the )?(?:domain|work)\s+(\S+)/)) ch.push({op:"remove",target:"domain",id:m[1]});
    else if(m=p.match(/(?:spend|budget).*?(\d[\d,]*)/)) (res=res||{}).spendLimitUsd=+m[1].replace(/,/g,"");
    else if(m=p.match(/storage.*?(\d+)/)) (res=res||{}).storageGb=+m[1];
    else if(m=p.match(/(?:give|grant)\s+(\S+@\S+)\s+access to\s+(\S+)/)){
      const em=m[1].toLowerCase();
      const cur=S.users.find(x=>x.email.toLowerCase()===em)?.access?.catalogs||[];
      ch.push({op:"set",target:"access",email:em,catalogs:[...new Set([...cur,m[2]])]});
    }
    else if(m=p.match(/(?:add|invite) (?:user )?(\S+@\S+)/)) ch.push({op:"add",target:"user",email:m[1].toLowerCase()});
    else if(m=p.match(/(?:remove|delete) (?:user )?(\S+@\S+)/)) ch.push({op:"remove",target:"user",email:m[1].toLowerCase()});
  });
  if(res) ch.push({op:"set",target:"resources",value:res});
  return ch;
}

const inAdmin=()=>R.parts[0]==="app"&&R.parts[1]==="setup";
let toastT=null; function toast(msg){ let t=$("#toast"); if(!t){ t=document.createElement("div"); t.id="toast"; document.body.appendChild(t);} t.textContent=msg; t.className="show"; clearTimeout(toastT); toastT=setTimeout(()=>t.className="",2600); }

/* ============================== shell ============================== */
function topbar(){
  const u=me(), a=u?acct():null;
  if(!u) return `<div class="brand" data-act="home">AD<span>as a Service</span></div><span class="spacer"></span>`;
  const tenant=u.role==="staff"?`<select class="tenant" data-act="switchAcct"><option value="">All accounts</option>${S.accounts.map(x=>`<option value="${x.id}" ${S.acting===x.id?"selected":""}>${esc(x.name)} (Dedicated)</option>`).join("")}</select>`:(a?`<span class="tenant-name">${esc(a.name)} (Dedicated)</span>`:"");
  return `<div class="brand" data-act="home">AD<span>as a Service</span></div>${tenant}<span class="spacer"></span>
  <div style="display:flex;align-items:center;gap:12px;flex-shrink:0">
    ${u.role==="staff"?`<a class="link ${R.parts[1]==="accounts"?"on":""}" href="#/app/accounts">All accounts</a>`:""}
    ${a&&a.status==="ready"?`<button class="link ${S.ui.dock===false?"":"on"}" data-act="toggleDock">Assistant</button>`:""}
    <span class="user"><b>${esc(u.name)}</b><small>${u.role==="staff"?"Admin":"User"}</small></span>
    <button class="link" data-act="signout">Sign out</button>
  </div>`;
}
function sidebar(){
  const u=me(), a=acct(), p1=R.parts[1]||"", p2=R.parts[2]||"";
  const link=(href,label,on,badge)=>`<a href="${href}" class="${on?"on":""}">${label}${badge?`<span class="badge">${badge}</span>`:""}</a>`;
  let h="";
  if(u.role==="staff"&&!a) h+=link("#/app/accounts","Accounts",true);
  if(a&&a.status==="ready"){
    const sect=(key,label,pages)=>{ const on=p1===key; return link("#/app/"+key+"/"+Object.keys(pages)[0],label,on)+(on?Object.entries(pages).map(([k,l])=>`<a class="sub ${(p2||Object.keys(pages)[0])===k?"on":""}" href="#/app/${key}/${k}">${l}</a>`).join(""):""); };
    h+=link("#/app","Overview",p1==="");
    if(isAdmin()) h+=sect("setup","Setup",SETUP_PAGES);
    h+=sect("reports","Reports",DASH_PAGES);
  }
  return `<nav class="side">${h}</nav>`;
}
function dock(){
  const a=acct(); if(!a||a.status!=="ready"||S.ui.dock===false) return "";
  const cfg=inAdmin()&&isAdmin();
  const list=cfg?chatFor(S.chats.cfg,a.id):chatFor(S.chats.ad,a.id);
  return `<aside class="dock"><div class="head"><b>${cfg?"Configgy":"ADy"}</b><small>${cfg?"Applies changes directly to this dedicated stack":"Turns requests into work orders and reports back"}</small></div>
  ${chatHtml(list,cfg?"cfg":"ad",cfg?"e.g. add work readygo-finance":"Tell ADy what you need",cfg?["add work readygo-finance","invite ana@client.com","set usage budget 8000","status"]:["profile store_master","produce a data foundation from the retail datasets","explore which stores drive returns","generate a model for weekly demand"])}</aside>`;
}
function stepper(cur){ const st=["Account","Set up","Environment","Ready"]; return `<ol class="stepper">${st.map((s,i)=>`<li class="${i<cur?"done":i===cur?"on":""}"><span>${i<cur?"✓":i+1}</span>${s}</li>`).join("")}</ol>`; }
const head=(title,sub,extra="")=>`<div class="phead"><div><h1>${title}</h1>${sub?`<p class="sub">${sub}</p>`:""}</div>${extra}</div>`;
const stat=(n,l,d)=>`<div class="stat"><small>${l}</small><b>${n}</b>${d?`<div class="d">${d}</div>`:""}</div>`;
const empty=t=>`<div class="empty-state">${t}</div>`;

function chatHtml(list,id,placeholder,sugg){
  return `<div class="chat">${list.map(m=>`<div class="msg ${m.r}">${esc(m.t)}${m.card||""}</div>`).join("")}</div>
  ${sugg?`<div class="sugg">${sugg.map(t=>`<button data-act="sugg" data-chat="${id}" data-v="${esc(t)}">${esc(t)}</button>`).join("")}</div>`:""}
  <form class="chat-in" data-chat="${id}"><input placeholder="${placeholder}" autocomplete="off"><button class="btn">Send</button></form>`;
}

/* ============================== views: onboarding & provisioning ============================== */
function vOnboard(){
  const o=onb(), d=o.d, step=o.step, sol=SOL.find(s=>s.id===d.solution), uc="Use case";
  const body=[
   ()=>`<h3>Register the client</h3><label>Client organisation</label><input data-bind="org" value="${esc(d.org)}" placeholder="e.g. HealthFirst AI" style="width:100%"><p class="log" style="margin-top:10px">The organisation name becomes the account name. The account is managed from ${esc(me()?.email||OPERATOR)}; the client's people are added as users.</p>`,
   ()=>`<h3>What do you want to do with the data?</h3><p class="log" style="margin:-6px 0 12px">Pick the ${uc.toLowerCase()} this account starts with. More can be added later.</p><div class="sol">${SOL.map(x=>`<div class="${d.solution===x.id?"on":""}" data-act="chooseSol" data-v="${x.id}"><b>${x.name}</b><small>${x.blurb}</small><br><small>${x.verbs.map(v=>v[0]+v.slice(1).toLowerCase()).join(" · ")}</small></div>`).join("")}</div>`,
   ()=>`<h3>Stack</h3><p class="log" style="margin:-6px 0 12px">Creating the account creates its stack: a dedicated Azure environment, database and compute that no other client shares.</p><div class="grid g2"><div><label>Region</label><select data-bind="region" style="width:100%">${REGIONS.map(r=>`<option ${d.region===r?"selected":""}>${r}</option>`).join("")}</select></div><div><label>Environment tier</label><select data-bind="env" style="width:100%">${ENVS.map(e=>`<option value="${e.id}" ${(d.env||"prod1")===e.id?"selected":""}>${e.label}</option>`).join("")}</select></div></div><div class="kv" style="margin-top:14px"><b>Tenancy</b><span>Dedicated (Single-Tenant isolated)</span><b>Management</b><span>Fully managed</span></div><div class="grid g2" style="margin-top:6px"><div><label>Usage budget (USD / month)</label><input data-bind="spend" type="number" value="${d.spend}" style="width:100%"></div><div><label>Storage limit (GB)</label><input data-bind="storage" type="number" value="${d.storage}" style="width:100%"></div></div><p class="log" style="margin-top:10px">Billing is a monthly fee plus usage. The client sees one number: what is left of the budget. AD stops scheduling work when it runs out; it can be raised later.</p>`,
   ()=>`<h3>Users</h3><p class="log" style="margin:-6px 0 12px">The client's people. Each gets a personal workspace and access to the work of the ${uc.toLowerCase()}. Users operate AD; they never configure it.</p><table><tr><th>Email</th><th></th></tr>${d.users.map((u,i)=>`<tr><td>${esc(u.email)}</td><td class="r"><button class="btn red sm" data-act="onbRmUser" data-v="${i}">Remove</button></td></tr>`).join("")||'<tr><td colspan="2" class="empty">No users yet. You can add them later.</td></tr>'}</table><div class="row" style="margin-top:10px"><input id="onbUser" placeholder="user@client.com" style="width:260px"><button class="btn ghost" data-act="onbAddUser">Add user</button></div>`,
   ()=>`<h3>Review and confirm</h3><div class="kv"><b>${uc}</b><span>${sol.name}</span><b>Account</b><span>${esc(d.org)}</span><b>Admin</b><span>${esc(me()?.email||OPERATOR)}</span><b>Users</b><span>${d.users.length}</span><b>Usage budget</b><span>$${(+d.spend).toLocaleString()}/month</span><b>Stack</b><span>${d.region} · ${d.env||"prod1"} · dedicated · fully managed</span><b>Storage limit</b><span>${d.storage} GB</span></div><details style="margin-top:14px"><summary class="log" style="cursor:pointer">Sales order</summary><pre style="margin-top:8px">${esc(JSON.stringify(salesOrder(),null,2))}</pre></details><p class="log">Confirming creates the account and triggers dedicated Terraform / Azure provisioning.</p>`
  ][step]();
  return `<div class="content narrow">${stepper(1)}<div class="wiz"><ol>${WIZ.map((w,i)=>`<li class="${i===step?"on":i<step?"done":""}">${i<step?"✓ ":""}${w}</li>`).join("")}</ol>
  <div><div class="card">${body}${S.ui.onbErr?`<div class="err" style="margin-top:10px">✕ ${esc(S.ui.onbErr)}</div>`:""}
  <div class="row" style="margin-top:18px;justify-content:space-between"><div>${step>0?`<button class="btn ghost" data-act="onbBack">Back</button>`:`<button class="btn ghost" data-act="onbCancel">Cancel</button>`}</div><div>${step<4?`<button class="btn" data-act="onbNext">Continue</button>`:`<button class="btn" data-act="onbConfirm">Confirm and provision</button>`}</div></div></div></div></div></div>
  <aside class="dock"><div class="head"><b>Configgy</b><small>Account setup · ask me anything while you fill this in</small></div>${chatHtml(S.chats.sales,"sales","Ask Configgy…")}</aside>`;
}
function vProvisioning(){
  const a=acct();
  let o=S.orders.find(x=>x.id===S.provisioning);
  if(!o&&a) o=S.orders.find(x=>x.accountId===a.id&&x.kind==="provision");
  if(!o) return `<div class="content narrow">${empty("Nothing is being set up.")}<div class="row" style="margin-top:14px"><a class="btn" href="#/app/accounts">Back to Accounts</a></div></div>`;
  const targetA=acct(o.accountId)||a;
  const ready=targetA?.status==="ready"||o.status==="applied";
  const logs=o.logs||[];
  return `<div class="content" style="max-width:1160px;margin:0 auto">${stepper(ready?3:2)}${head(ready?"Your environment is ready":"Setting up "+esc(targetA?.name||"client environment"),ready?"AD has started. All dedicated Azure resources are verified and active.":"Terraform / Azure ARM provisioning is running. You can leave this page; we'll keep going.")}
  <div class="grid" style="grid-template-columns:360px 1fr;gap:20px;align-items:start">
    <div class="card">
      <h3>Progress</h3>
      <ul class="steps">${(o.jobs||[]).map(([n,st])=>`<li><span class="dot ${st==="done"?"done":st==="run"?"run":st==="error"?"error":""}"></span><span>${n} <span class="log">${st==="run"?"running…":st==="done"?"done":st==="error"?"error":""}</span></span></li>`).join("")}</ul>
      <div class="row" style="margin-top:16px">
        ${ready?`<a class="btn lg" href="#/app" style="width:100%">Open your account</a>`:`<button class="btn lg" data-act="forceReady" style="width:100%">Open your account</button>`}
        ${isAdmin()?`<a class="btn ghost sm" href="#/app/accounts" style="width:100%">Back to All accounts</a>`:""}
      </div>
      <div style="margin-top:16px;padding-top:14px;border-top:1px solid var(--line)">
        <details><summary class="log" style="cursor:pointer">What is being set up</summary>
          <div class="diff" style="margin-top:8px">${(o.changes||[]).map(c=>`<div>${esc(describe(c))}</div>`).join("")}</div>
        </details>
      </div>
    </div>
    <div class="card" style="background:#0d1117;color:#c9d1d9;border:1px solid #30363d;padding:0;overflow:hidden">
      <div style="background:#161b22;padding:10px 16px;border-bottom:1px solid #30363d;display:flex;justify-content:space-between;align-items:center">
        <span style="font-size:12px;font-weight:600;color:#8b949e;font-family:monospace"><span style="color:${ready?'#56d364':'#58a6ff'}">●</span> Terraform &amp; Azure Provisioning Console</span>
        <span style="font-size:11px;color:${ready?'#56d364':'#e3b341'};font-family:monospace;font-weight:600">${ready?"● COMPLETED (EXIT 0)":"● LIVE STREAM"}</span>
      </div>
      <div id="pipeline-terminal" style="padding:14px;font-family:ui-monospace,Consolas,monospace;font-size:12px;line-height:1.7;height:400px;overflow-y:auto;white-space:pre-wrap">
        ${logs.length?logs.map(l=>{
          const tm=(l.timestamp||"").split("T")[1]?.slice(0,8)||"00:00:00";
          const color=l.status==="error"?"#f85149":l.status==="done"?"#56d364":"#e3b341";
          const tag=l.status==="error"?"[FAIL]":l.status==="done"?"[DONE]":"[RUN]";
          return `<div><span style="color:#6e7681">[${tm}]</span> <span style="color:${color};font-weight:600">${tag}</span> <span style="color:#79c0ff">[${esc(l.step)}]</span> ${esc(l.message)}</div>`;
        }).join(""):`<div style="color:#8b949e">[INIT] Initializing dedicated stack provisioning workflow for ${esc(targetA?.name||o.accountId)}...</div>`}
        ${ready?`<div style="color:#56d364;margin-top:8px;font-weight:600">✔ Dedicated environment ready.</div>`:`<div style="color:#e3b341;margin-top:6px"><span class="spin">◐</span> Provisioning Azure resources...</div>`}
      </div>
    </div>
  </div></div>`;
}

/* ============================== views: app ============================== */
function vOverview(){
  const a=acct(), sol=SOL.find(s=>s.id===a.solution)||SOL[0], users=accountUsers(a);
  const ws=S.works.filter(w=>w.accountId===a.id), running=ws.filter(w=>w.status!=="done").length, done=ws.length-running;
  const pct=Math.min(100,Math.round((a.usage?.spendUsd||0)/(a.resources?.spendLimitUsd||1)*100));
  const checklist=[["Stack ready",true,"#/app/setup/environment"],["Add the client's people and set their access",users.length>0,"#/app/setup/users"],["Run your first job and check the numbers",ws.length>0,"#/app/reports/metrics"]];
  const showCheck=ws.length<2&&isAdmin();
  const activity=[...ws.map(w=>({t:w.id,d:w.text,s:w.status,href:"#/app/reports/metrics"})),...S.orders.filter(o=>o.accountId===a.id).map(o=>({t:o.id,d:o.changes.map(describe).join(", "),s:o.status,href:"#/app/reports/audit"}))].slice(0,6);
  return `<div class="content">${head("Overview",`${capName(a)} · ${a.region} · ${a.env||"prod1"} · Dedicated`)}
  <div class="stats">${stat(a.datasets.length,"Datasets",a.datasets.reduce((n,d)=>n+d.gb,0).toFixed(1)+" GB")}${stat(ws.length,"Work orders",running?running+" running":"none running")}${stat("$"+balance(a).toLocaleString(),"Balance left",pct+"% of $"+a.resources.spendLimitUsd.toLocaleString()+" used")}${stat(done,"Runs completed",`<a href="#/app/reports/metrics">See metrics</a>`)}</div>
  <div class="grid g2">
  ${showCheck?`<div class="card"><h3>Getting started</h3><ul class="check">${checklist.map(([t,dn,href])=>`<li class="${dn?"done":""}"><span>${dn?"✓":""}</span><a href="${href}">${t}</a></li>`).join("")}</ul></div>`:`<div class="card"><h3>Use case</h3><div class="big">${capName(a)}</div><p class="log">${sol.blurb}</p>${sol.verbs.map(v=>`<span class="pill">${v}</span>`).join("")}</div>`}
  <div class="card"><h3>Recent activity</h3>${activity.map(x=>`<a class="act" href="${x.href}"><span><b>${x.t}</b> <span class="log">${esc(x.d)}</span></span><span class="chip ${chip(x.s)}">${x.s}</span></a>`).join("")||empty("Bring data in, pick an action, get results you can measure. Start by asking ADy.")}</div></div></div>`;
}
const woTable=ws=>`<div class="card flush"><table><tr><th>Work order</th><th>Request</th><th>By</th><th>Status</th></tr>${ws.map(w=>`<tr><td><b>${w.id}</b><br><span class="log">${w.verb}</span></td><td>${esc(w.text)}${w.result?`<br><span class="log">${esc(w.result)}</span>`:""}${w.metrics&&w.metrics.length?`<div class="metrics">${w.metrics.map(([k,v])=>`<span><small>${k}</small><b>${v}</b></span>`).join("")}</div>`:""}</td><td class="log">${esc(w.by)}</td><td><span class="chip ${chip(w.status)}">${w.status}</span>${w.promoted?` <span class="chip ok">in catalog</span>`:w.status==="done"&&w.verb!=="DATA"?` <button class="btn ghost sm" data-act="promote" data-v="${w.id}">Promote</button>`:""}</td></tr>`).join("")||`<tr><td colspan="4">${empty("Nothing has run here yet. Tell ADy what you want and the result, with its numbers, will show up here.")}</td></tr>`}</table></div>`;
function vSetup(k){
  const a=acct(), users=accountUsers(a);
  const err=S.ui.cfgErr?`<div class="err" style="margin-top:8px">✕ ${esc(S.ui.cfgErr)}</div>`:"";
  switch(k){
   case "environment": return `<div class="content">${head("Stack & limits","The use case, dedicated stack and limits this account runs on.")}<div class="grid g2"><div class="card"><h3>Stack</h3><div class="kv"><b>Use case</b><span>${capName(a)}</span><b>Region</b><span>${a.region}</span><b>Environment tier</b><span>${a.env||"prod1"}</span><b>Resource group</b><span style="font-family:monospace;font-size:12.5px">${rgName(a)}</span><b>Tenancy</b><span>Dedicated</span><b>Management</b><span>Fully managed</span><b>Status</b><span><span class="chip ${chip(a.status)}">${a.status}</span></span><b>Created</b><span>${a.created||a.created_at||""}</span></div></div>
    <div class="card"><h3>Limits</h3><div class="row"><div><label>Usage budget (USD / month)</label><input id="rs" type="number" value="${a.resources.spendLimitUsd}" style="width:160px"></div><div><label>Storage limit (GB)</label><input id="rg" type="number" value="${a.resources.storageGb}" style="width:120px"></div><div style="align-self:flex-end"><button class="btn" data-act="setRes">Save</button></div></div>${err}</div></div>
    <div class="card"><h3>Generated Terraform Configuration (infrastructure.tfvars)</h3><p class="sub">Live Terraform parameters synchronized for this dedicated client stack.</p><button class="btn sm" data-act="loadTfvars" data-v="${a.id}">View Generated .tfvars</button><pre id="tfvars-out" style="display:none;margin-top:12px"></pre></div></div>`;
   case "work": return `<div class="content">${head("Work","The work this account can do. People are given access to work one by one, and each piece of work gets a shared workspace for everyone who has it.")}<div class="card flush"><table><tr><th>Work</th><th>What it does</th><th></th></tr>${a.domains.map(d=>`<tr><td><b>${REGISTRY[d]||d}</b><br><span class="log">${d}</span></td><td>${WORK_INFO[d]||""}</td><td class="r"><button class="btn red sm" data-act="rmDomain" data-v="${d}">Remove</button></td></tr>`).join("")}</table></div>
    <div class="card"><h3>Add work</h3><div class="row"><select id="nd">${Object.entries(REGISTRY).filter(([k])=>!a.domains.includes(k)).map(([k,v])=>`<option value="${k}">${v}</option>`).join("")||`<option value="">All available work added</option>`}</select><button class="btn" data-act="addDomain" ${Object.entries(REGISTRY).some(([k])=>!a.domains.includes(k))?"":"disabled"}>Add</button></div>${err}</div></div>`;
   case "users": {
    const ed=S.ui.editUser?users.find(u=>u.email.toLowerCase()===S.ui.editUser.toLowerCase()):null;
    const acc=u=>u.access||{catalogs:[]};
    const editor=ed?`<div class="card"><h3>Access for ${esc(ed.name)} <span class="log">· ${esc(ed.email)}</span></h3>
      <label>Work they can use</label>${a.domains.map(d=>`<label class="ck"><input type="checkbox" class="ea-cat" value="${d}" ${acc(ed).catalogs.includes(d)?"checked":""}> ${workLabel(d)}</label>`).join("")||'<span class="empty">No work yet.</span>'}
      ${err}<div class="row" style="margin-top:14px"><button class="btn" data-act="saveAccess" data-v="${esc(ed.email)}">Save access</button><button class="btn ghost" data-act="cancelAccess">Cancel</button></div></div>`:"";
    return `<div class="content">${head("Users","The client's people and the work each can use. Everyone gets a personal workspace automatically.")}${editor}<div class="card flush"><table><tr><th>Name</th><th>Work</th><th></th></tr>${users.map(u=>`<tr class="${ed&&ed.email===u.email?"sel":""}"><td><b>${esc(u.name)}</b><br><span class="log">${esc(u.email)}</span></td><td>${acc(u).catalogs.map(x=>`<span class="pill">${REGISTRY[x]||x}</span>`).join("")||'<span class="log">none</span>'}</td><td class="r"><button class="btn ghost sm" data-act="editAccess" data-v="${esc(u.email)}">Edit access</button> <button class="btn red sm" data-act="rmUser" data-v="${esc(u.email)}">Remove</button></td></tr>`).join("")||`<tr><td colspan="3">${empty("No users yet.")}</td></tr>`}</table></div>
    <div class="card"><h3>Add a user</h3><label>Email</label><input id="nu" placeholder="name@client.com" style="width:260px"><label>Work they can use</label>${a.domains.map(d=>`<label class="ck"><input type="checkbox" class="nu-work" value="${d}" checked> ${workLabel(d)}</label>`).join("")||'<span class="empty">Add work first.</span>'}<div class="row" style="margin-top:12px"><button class="btn" data-act="addUser">Add user</button></div><p class="log">They also get a personal workspace automatically. Change their work any time with Edit access.</p>${ed?"":err}</div></div>`;
   }
  }
  return `<div class="content">${empty("Not found.")}</div>`;
}
function vDash(k){
  const a=acct();
  switch(k){
   case "usage": { const pct=Math.min(100,Math.round((a.usage?.spendUsd||0)/(a.resources?.spendLimitUsd||1)*100));
    return `<div class="content">${head("Usage","What is left of this month's usage budget.")}<div class="card"><h3>Balance</h3><div class="big">$${balance(a).toLocaleString()} <span class="log">left of $${a.resources.spendLimitUsd.toLocaleString()}</span></div><div class="bar" style="margin:10px 0"><i class="${pct>=90?"bad":pct>=75?"warn":""}" style="width:${pct}%"></i></div>${pct>=75?`<div class="warn">${pct}% of the usage budget used.</div>`:""}<p class="log">One number covers everything AD does for you this month.</p></div></div>`; }
   case "metrics": { const done=S.works.filter(w=>w.accountId===a.id&&w.status==="done"); const hrs=done.reduce((n,w)=>n+(HRS[w.verb]||0),0);
    return `<div class="content">${head("Metrics","What AD has accomplished, not only what it used.")}<div class="stats">${stat(done.length,"Runs completed")}${stat(a.datasets.reduce((n,d)=>n+d.gb,0).toFixed(1)+" GB","Data processed")}${stat("~"+hrs+" h","Time saved","against doing it by hand")}${stat(done.filter(w=>w.promoted).length,"Results in the catalog")}</div><h3 style="margin:18px 0 8px">Work accomplished</h3>${woTable(done)}</div>`; }
   case "audit": { const ids=new Set([a.id,...S.orders.filter(o=>o.accountId===a.id).map(o=>o.id),...S.works.filter(w=>w.accountId===a.id).map(w=>w.id),...S.orders.filter(o=>o.accountId===a.id&&o.salesOrder).map(o=>o.salesOrder.salesOrderId),...accountUsers(a).map(u=>u.email)]);
    return `<div class="content">${head("Audit log","Every order, job and sign-in, with who did it.")}<div class="card flush"><table><tr><th>Time</th><th>Actor</th><th>Action</th><th>Ref</th></tr>${S.audit.filter(e=>ids.has(e.ref)||(e.ref==="SO-0001"&&a.id==="alida-internal")).map(e=>`<tr><td class="log">${e.t}</td><td>${esc(e.actor)}</td><td>${esc(e.action)}</td><td class="log">${esc(e.ref)}</td></tr>`).join("")}</table></div></div>`; }
  }
  return `<div class="content">${empty("Not found.")}</div>`;
}
function vAccounts(){
  return `<div class="content">${head("Accounts","Every dedicated client account and its stack.",`<a class="btn" href="#/onboard">Set up a client account</a>`)}
  <div class="card flush"><table><tr><th>Account</th><th>Use case</th><th>Stack</th><th>Users</th><th>Balance</th><th>Status</th><th></th></tr>
  ${S.accounts.map(a=>`<tr><td><b>${esc(a.name)}</b> <span class="chip ok" style="font-size:10px;padding:1px 6px">Dedicated</span><br><span class="log">${a.created||a.created_at||""}</span></td><td>${capName(a)}</td><td><span style="font-family:monospace;font-size:12px">${rgName(a)}</span><br><span class="log">${a.region} · ${a.env||"prod1"}</span></td><td>${accountUsers(a).length}</td><td>$${balance(a).toLocaleString()} of $${a.resources.spendLimitUsd.toLocaleString()}</td><td><span class="chip ${chip(a.status)}">${a.status}</span></td><td class="r">${a.status==="provisioning"?`<button class="btn ghost sm" data-act="viewProvisioning" data-v="${a.id}">View progress</button>`:`<button class="btn ghost sm" data-act="openAccount" data-v="${a.id}" ${a.status!=="ready"?"disabled":""}>Open</button>`}</td></tr>`).join("")}</table></div></div>`;
}

/* ============================== demos ============================== */
const asAdmin=(acc="alida-internal")=>{ login("demetrius@alidainc.com","ad"); S.acting=acc; };
const freshOnb=()=>{ login("demetrius@alidainc.com","ad"); delete S.onbs.staff; };
const DEMOS={
  reset:()=>{ store.del(); S=seed(); fetchBackendState(); return "/"; },
  L1:()=>{ freshOnb(); startOnboarding(); return "/onboard"; },
  L2:()=>{ login("demetrius@alidainc.com","ad"); return "/app/accounts"; },
  L3:()=>{ asAdmin(); return "/app"; }
};

/* ============================== render ============================== */
function render(){
  R=parseHash(); const p=R.parts[0]||""; const u=me();
  if(p==="demo"){ const f=DEMOS[R.parts[1]]; const to=f?f():"/"; save(); nav(to,true); return; }
  const needUser=["onboard","provisioning","app"];
  if(needUser.includes(p)&&!u){ nav("/login",true); return; }
  if(p==="register"){ nav("/login",true); return; }
  if(p==="login"&&u){ nav(landing(),true); return; }
  if(p==="onboard"){ if(u.role!=="staff"){ nav(landing(),true); return; } if(!onb()) startOnboarding(); }
  let staffOnly=false;
  if(p==="app"){
    const sub=R.parts[1]||"";
    staffOnly=sub==="accounts";
    if(u.role==="staff"&&!S.acting&&!staffOnly){ nav("/app/accounts",true); return; }
    if(staffOnly&&u.role!=="staff"){ nav("/app",true); return; }
    if(!staffOnly){ const a=acct(); if(!a){ nav(landing(),true); return; } if(a.status!=="ready"){ nav("/provisioning",true); return; } }
    if(sub==="setup"&&!isAdmin()){ nav("/app",true); return; }
  }
  $("#hdr").innerHTML=topbar();
  const app=$("#app"); const sc=app.querySelector(".content,.site")?.scrollTop||0;
  let html;
  if(PUBLIC.includes(p)) html=vLogin();
  else if(p==="onboard") html=`<div class="shell plain">${vOnboard()}</div>`;
  else if(p==="provisioning") html=`<div class="shell plain">${vProvisioning()}</div>`;
  else if(p==="app"){ const sub=R.parts[1]||""; let main;
    if(sub==="accounts") main=vAccounts(); else if(sub==="") main=vOverview(); else if(sub==="setup") main=vSetup(R.parts[2]||"environment"); else if(sub==="reports") main=vDash(R.parts[2]||"usage"); else main=`<div class="content">${empty("Not found.")}</div>`;
    html=`<div class="shell">${sidebar()}${main}${staffOnly?"":dock()}</div>`; }
  else html=vLogin();
  app.innerHTML=html;
  const pg=app.querySelector(".content,.site"); if(pg&&p===lastPage) pg.scrollTop=sc; lastPage=p;
  document.querySelectorAll(".chat").forEach(c=>c.scrollTop=c.scrollHeight);
  const term=document.getElementById("pipeline-terminal"); if(term) term.scrollTop=term.scrollHeight;
}
let lastPage="";

/* ============================== events ============================== */
const g=id=>document.getElementById(id);
const direct=(changes,okMsg)=>{ const o=createOrder(acct(),changes,"page",{direct:true}); S.ui.cfgErr=o.status==="invalid"?o.validation.errors.join(" "):""; if(!S.ui.cfgErr) toast(okMsg||"Saved"); };
const ACT={
  home:()=>nav(me()?landing():"/"), signout:()=>{logout();delete S.provisioning;save();nav("/");},
  toggleDock:()=>{S.ui.dock=S.ui.dock===false;save();},
  switchAcct:el=>{S.acting=el.value||null;save();nav(el.value?"/app":"/app/accounts");},
  chooseSol:el=>{onb().d.solution=el.dataset.v;save();},
  onbNext:()=>{ const o=onb(); S.ui.onbErr=onbValidate(o.step); if(!S.ui.onbErr) o.step++; save(); },
  onbBack:()=>{S.ui.onbErr="";onb().step--;save();},
  onbCancel:()=>{ delete S.onbs.staff; save(); nav("/app/accounts"); },
  onbConfirm:()=>{ S.ui.onbErr=[0,2].map(onbValidate).find(Boolean)||""; save(); if(!S.ui.onbErr){confirmOnboarding();return "norender";} },
  onbAddUser:()=>{
    const v=g("onbUser").value.trim().toLowerCase(); const d=onb().d;
    if(!/^\S+@\S+\.\S+$/.test(v)){S.ui.onbErr="Enter a valid email.";return;}
    if(d.users.some(u=>u.email.toLowerCase()===v)||S.users.some(u=>u.email.toLowerCase()===v&&(u.accountId||u.role==="staff"))){S.ui.onbErr="Already listed, belongs to another account, or is an Alida admin.";return;}
    S.ui.onbErr=""; d.users.push({email:v}); save();
  },
  onbRmUser:el=>{onb().d.users.splice(+el.dataset.v,1);save();},
  forceReady:()=>{
    if(_pollTimer){ clearInterval(_pollTimer); _pollTimer=null; }
    const a=acct();
    if(a) a.status="ready";
    let o=S.orders.find(x=>x.id===S.provisioning||(a&&x.accountId===a.id));
    if(o){ o.status="applied"; (o.jobs||[]).forEach(j=>j[1]="done"); }
    delete S.provisioning; save(); nav("/app");
  },
  loadTfvars:el=>{
    const out=g("tfvars-out"); if(!out) return "norender";
    out.style.display="block"; out.textContent="Loading generated infrastructure.tfvars from backend...";
    fetch('/api/accounts/'+el.dataset.v+'/tfvars').then(r=>r.json()).then(d=>{ out.textContent=d.content||"No tfvars generated yet."; }).catch(()=>{ out.textContent="Backend offline."; });
    return "norender";
  },
  openAccount:el=>{S.acting=el.dataset.v;save();nav("/app");},
  viewProvisioning:el=>{
    const a=S.accounts.find(x=>x.id===el.dataset.v); if(!a) return;
    const o=S.orders.find(x=>x.accountId===a.id&&x.kind==="provision");
    S.acting=a.id; if(o) S.provisioning=o.id; save(); nav("/provisioning");
    if(o&&o.status!=="applied"){ const sol=SOL.find(s=>s.id===a.solution)||SOL[0]; pollBackendOrder(o.id,o,a,sol); }
  },
  addDomain:()=>{ const v=g("nd")?.value; if(v) direct([{op:"add",target:"domain",id:v}],"Work added"); },
  rmDomain:el=>{ if(confirm("Remove work "+(REGISTRY[el.dataset.v]||el.dataset.v)+"?")) direct([{op:"remove",target:"domain",id:el.dataset.v}],"Work removed"); },
  editAccess:el=>{S.ui.editUser=el.dataset.v;S.ui.cfgErr="";}, cancelAccess:()=>{S.ui.editUser=null;S.ui.cfgErr="";},
  saveAccess:el=>{ const em=el.dataset.v; direct([{op:"set",target:"access",email:em,catalogs:[...document.querySelectorAll(".ea-cat:checked")].map(x=>x.value)}],"Access updated"); if(!S.ui.cfgErr) S.ui.editUser=null; },
  addUser:()=>{ const em=g("nu").value.trim().toLowerCase(); const ch=[{op:"add",target:"user",email:em}]; const w=[...document.querySelectorAll(".nu-work:checked")].map(x=>x.value); if(w.length) ch.push({op:"set",target:"access",email:em,catalogs:w}); direct(ch,"User added"); },
  rmUser:el=>{ if(confirm("Remove "+el.dataset.v+"?")) direct([{op:"remove",target:"user",email:el.dataset.v}],"Removed"); },
  promote:el=>{ const w=S.works.find(x=>x.id===el.dataset.v); if(w){ w.promoted=true; log("work-order.promoted",w.id); save(); toast("Promoted to the catalog"); } },
  setRes:()=>direct([{op:"set",target:"resources",value:{spendLimitUsd:+g("rs").value,storageGb:+g("rg").value}}],"Allocation saved"),
  sugg:el=>sendChat(el.dataset.chat,el.dataset.v)
};
function sendChat(id,text){ if(!text) return; if(id==="sales") salesySay(text); else if(id==="cfg") configgySay(text); else if(id==="ad") adySay(text); }
document.body.addEventListener("click",e=>{ const an=e.target.closest('a[href^="#/"]'); if(an&&!HASH_OK){ e.preventDefault(); nav(an.getAttribute("href").slice(1)); return; } const el=e.target.closest("[data-act]"); if(!el||e.target.closest("a[href]")) return; if(el.tagName==="SELECT"||el.tagName==="INPUT") return; e.preventDefault(); const r=ACT[el.dataset.act]?.(el); if(r!=="norender") render(); });
document.body.addEventListener("change",e=>{ const el=e.target; if(el.dataset.bind&&onb()){ onb().d[el.dataset.bind]=el.value; save(); return; } if(el.dataset.act&&ACT[el.dataset.act]){ ACT[el.dataset.act](el); render(); } });
document.body.addEventListener("submit",e=>{ e.preventDefault(); const f=e.target; const fd=new FormData(f);
  if(f.dataset.chat){ const inp=f.querySelector("input"); const v=inp.value.trim(); inp.value=""; sendChat(f.dataset.chat,v); render(); return; }
  if(f.dataset.form==="login"){
    const email=fd.get("email").trim().toLowerCase();
    const password=fd.get("password");
    if(window.fetch){
      fetch('/api/auth/login',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({email,password})
      }).then(r=>r.json()).then(res=>{
        if(res.ok&&res.user){
          if(res.state) mergeBackendState(res.state);
          const role=res.user.role==="staff"?"staff":"user";
          const access=res.user.access&&Array.isArray(res.user.access.catalogs)?res.user.access:{catalogs:[]};
          const norm=Object.assign({},res.user,{accountId:res.user.accountId||res.user.account_id||null,role,access});
          const idx=S.users.findIndex(u=>u.email.toLowerCase()===norm.email.toLowerCase());
          if(idx>=0) S.users[idx]=Object.assign(S.users[idx],norm);
          else S.users.push(norm);
          S.session={email:norm.email}; S.ui.dock=true; S.ui.authErr="";
          S.acting=role==="staff"?null:norm.accountId;
          save(); nav(landing());
        } else {
          S.ui.authErr=res.detail||"Wrong email or password.";
          render();
        }
      }).catch(()=>{
        S.ui.authErr=login(email,password); save();
        if(S.ui.authErr) render(); else nav(landing());
      });
    } else {
      S.ui.authErr=login(email,password); save();
      if(S.ui.authErr) render(); else nav(landing());
    }
  }
});
window.addEventListener("hashchange",render);
render();
</script>
