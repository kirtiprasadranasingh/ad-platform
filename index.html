function checkBackendHealth(){
  if(!window.fetch) return;

    .then(r => r.json())

function fetchBackendState(){
  if(!window.fetch) return;
  fetch('/api/state')
    .then(r => r.ok ? r.json() : null)
    .then(d => {
      if(!d) return;
      if(d.users && d.users.length) {
        d.users.forEach(u => {
          u.accountId = u.accountId || u.account_id;
          const idx = S.users.findIndex(x => x.email.toLowerCase() === u.email.toLowerCase());
          if(idx >= 0) S.users[idx] = Object.assign(S.users[idx], u);
          else S.users.push(u);
        });
      }
      if(d.accounts && d.accounts.length) {
        d.accounts.forEach(a => {
          const idx = S.accounts.findIndex(x => x.id === a.id);
          if(idx >= 0) S.accounts[idx] = Object.assign(S.accounts[idx], a);
          else S.accounts.push(a);
        });
      }
      if(d.orders && d.orders.length) {
        d.orders.forEach(o => {
          const idx = S.orders.findIndex(x => x.id === o.id);
          if(idx >= 0) S.orders[idx] = Object.assign(S.orders[idx], o);
          else S.orders.push(o);
        });
      }
      store.set(JSON.stringify(S));
      render();
    })
    .catch(()=>{});
}
fetchBackendState();

function pollBackendOrder(orderId, co, a, sol, d){
  const interval = setInterval(() => {
    fetch('/api/orders/' + orderId)
      .then(r => r.json())
      .then(orderData => {
        if(orderData && orderData.jobs){
          co.jobs = orderData.jobs;
          if(orderData.logs) co.logs = orderData.logs;
          if(orderData.status === "applied"){
            clearInterval(interval);
            a.domains = sol.domains.slice();
            a.sandboxes = [{name: d.sandbox, mode: "dedicated", quotaGb: +d.quota}];
            a.status = "ready";
            co.status = "applied";
            log("config-order.applied", co.id, "orchestrator");
            log("jumpstart.done", a.id, "orchestrator");
            save();
            render();
          } else if(orderData.status === "failed"){
            clearInterval(interval);
            co.status = "failed";
            render();
          } else {
            render();
          }
        }
      })
      .catch(() => clearInterval(interval));
  }, 1000);
}

/* ============================== config orders ============================== */
function describe(c){
  if(c.op==="provision") return "provision environment: "+c.value;
  if(c.target==="domain") return (c.op==="add"?"+ ":"− ")+"domain "+(REGISTRY[c.id]||c.id);
  if(c.target==="sandbox") return c.op==="add"?`+ sandbox ${c.name} (${c.mode}, ${c.quotaGb} GB)`:`− sandbox ${c.name}`;
  if(c.target==="user") return c.op==="add"?`+ user ${c.email} as ${c.role}`:c.op==="remove"?`− user ${c.email}`:`~ user ${c.email} → ${c.role}`;
  if(c.target==="resources") return "~ allocation "+Object.entries(c.value).map(([k,v])=>`${k}=${v}`).join(", ");
  return JSON.stringify(c);
}
function validate(a,changes){
  const errors=[],warnings=[];
  const doms=new Set(a.domains),sbx=new Map(a.sandboxes.map(s=>[s.name,s])),usr=new Map(accountUsers(a).map(u=>[u.email,{role:u.role}]));
  let used=a.sandboxes.reduce((n,s)=>n+s.quotaGb,0),cap=a.resources.storageGb;
  if(!changes.length) errors.push("The order contains no changes.");
  for(const c of changes){
    if(c.target==="domain"){ if(c.op==="add"){ if(!REGISTRY[c.id]) errors.push(`Domain "${c.id}" is not in the registry.`); else if(doms.has(c.id)) warnings.push(`${c.id} already present.`); else doms.add(c.id);} else { if(!doms.has(c.id)) errors.push(`Domain ${c.id} is not present.`); else doms.delete(c.id);} }
    else if(c.target==="sandbox"){ if(c.op==="add"){ if(!c.name) errors.push("Sandbox name required."); else if(sbx.has(c.name)) errors.push(`Sandbox ${c.name} already exists.`); else {used+=+c.quotaGb; sbx.set(c.name,c);} } else { if(!sbx.has(c.name)) errors.push(`Sandbox ${c.name} is not present.`); else {used-=sbx.get(c.name).quotaGb; sbx.delete(c.name);} } }
    else if(c.target==="user"){ if(!/^\S+@\S+\.\S+$/.test(c.email)) errors.push("Invalid email: "+c.email);
      else if(c.op==="add"){ if(usr.has(c.email)) warnings.push(c.email+" is already a user."); else if(S.users.some(u=>u.email===c.email&&u.accountId&&u.accountId!==a.id)) errors.push(c.email+" belongs to another account."); else usr.set(c.email,{role:c.role}); }
      else if(c.op==="remove"){ if(!usr.has(c.email)) errors.push(c.email+" is not a user."); else usr.delete(c.email); }
      else if(c.op==="set"){ if(!usr.has(c.email)) errors.push(c.email+" is not a user."); else usr.set(c.email,{role:c.role}); } }
    else if(c.target==="resources"){ if(c.value.spendLimitUsd!=null&&c.value.spendLimitUsd>MAX_SPEND) errors.push(`Spend limit above policy maximum ($${MAX_SPEND.toLocaleString()}).`); if(c.value.storageGb!=null) cap=c.value.storageGb; }
  }
  if(used>cap) errors.push(`Sandbox quota ${used} GB exceeds storage allocation ${cap} GB.`);
  if(![...usr.values()].some(u=>u.role==="admin")) errors.push("An account must keep at least one admin.");
  return {ok:!errors.length,errors,warnings};
}
function apply(a,changes){
  for(const c of changes){
    if(c.target==="domain"){ if(c.op==="add"&&!a.domains.includes(c.id)) a.domains.push(c.id); if(c.op==="remove") a.domains=a.domains.filter(x=>x!==c.id); }
    else if(c.target==="sandbox"){ if(c.op==="add") a.sandboxes.push({name:c.name,mode:c.mode,quotaGb:+c.quotaGb}); else a.sandboxes=a.sandboxes.filter(x=>x.name!==c.name); }
    else if(c.target==="user"){ const u=S.users.find(u=>u.email===c.email);
      if(c.op==="add"){ if(u){u.accountId=a.id;u.role=c.role;} else S.users.push({email:c.email,name:c.name||c.email.split("@")[0],password:"welcome",accountId:a.id,role:c.role}); }
      if(c.op==="remove"&&u){ S.users=S.users.filter(x=>x.email!==c.email); }
      if(c.op==="set"&&u){ u.role=c.role; } }
    else if(c.target==="resources") Object.assign(a.resources,c.value);
  }
}
function createOrder(a,changes,source,opts={}){
  const v=validate(a,changes);
  const o={id:nid("co"),accountId:a.id,kind:opts.kind||"change",source,requestedBy:me()?.email||"visitor",status:v.ok?(opts.direct?"applied":"pending"):"invalid",validation:v,changes,jobs:[],created:now(),note:opts.note||""};
  S.orders.unshift(o); log("config-order.created ("+source+")",o.id);
  if(v.ok&&opts.direct){ apply(a,changes); log("config-order.applied (direct, dashboard)",o.id); }
  save(); return o;
}
function approveOrder(o){
  const a=acct(o.accountId); const v=validate(a,o.changes);
  if(!v.ok){ o.validation=v; o.status="invalid"; save(); render(); return; }
  o.status="running"; log("config-order.approved",o.id); o.jobs=[["Service configuration (ADSvcConfig)","pending"],["Verify","pending"]]; save(); render();
  if(window.fetch){
    fetch('/api/orders/apply',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({accountId: a.id, orderId: o.id, changes: o.changes})
    }).then(r=>r.json()).then(data=>{
      if(data && data.azure_actions){
        data.azure_actions.forEach(act=>log(act, o.id, "azure-arm"));
        save();
        render();
      }
    }).catch(e=>console.log("Apply sync error:", e));
  }
  runJobs(o,()=>{ apply(a,o.changes); o.status="applied"; log("config-order.applied",o.id,"orchestrator"); save(); render(); });
}
function rejectOrder(o){ o.status="rejected"; log("config-order.rejected",o.id); save(); render(); }
function runJobs(o,done,i=0){
  if(i>=o.jobs.length){ done(); return; }
  o.jobs[i][1]="run"; save(); render();
  setTimeout(()=>{ o.jobs[i][1]="done"; log("job.done · "+o.jobs[i][0],o.id,"orchestrator"); save(); render(); runJobs(o,done,i+1); },1000);
}

function parseConfig(text){
  const t=text.toLowerCase(); const ch=[]; let res=null;
  t.split(/\s+and\s+|,|;/).forEach(p=>{ let m;
    if(m=p.match(/add (?:the )?domain\s+(\S+)/)) ch.push({op:"add",target:"domain",id:m[1]});
    else if(m=p.match(/(?:remove|drop|delete) (?:the )?domain\s+(\S+)/)) ch.push({op:"remove",target:"domain",id:m[1]});
    else if(m=p.match(/add (?:a )?sandbox\s+(\S+)(?:\s+(\d+)\s*gb)?/)) ch.push({op:"add",target:"sandbox",name:m[1],mode:"dedicated",quotaGb:+(m[2]||50)});
    else if(m=p.match(/(?:remove|drop|delete) (?:the )?sandbox\s+(\S+)/)) ch.push({op:"remove",target:"sandbox",name:m[1]});
    else if(m=p.match(/(?:spend|budget).*?(\d[\d,]*)/)) (res=res||{}).spendLimitUsd=+m[1].replace(/,/g,"");
    else if(m=p.match(/storage.*?(\d+)/)) (res=res||{}).storageGb=+m[1];
    else if(m=p.match(/(?:add|invite) (?:user )?(\S+@\S+)(?:\s+as\s+(admin|user))?/)) ch.push({op:"add",target:"user",email:m[1],role:m[2]||"user"});
    else if(m=p.match(/(?:remove|delete) (?:user )?(\S+@\S+)/)) ch.push({op:"remove",target:"user",email:m[1]});
    else if(m=p.match(/(?:make|promote)\s+(\S+@\S+)\s+(?:an? )?admin/)) ch.push({op:"set",target:"user",email:m[1],role:"admin"});
  });
  if(res) ch.push({op:"set",target:"resources",value:res});
  return ch;
}
const isConfigIntent=t=>/\b(add|remove|drop|delete|invite|promote)\b.*\b(domain|sandbox|user|admin)\b|\b(spend|budget|storage|quota|limit)\b/i.test(t);

      <div><label>Azure Region</label><select name="region" style="width:100%"><option value="eastus2" selected>East US 2 (Azure)</option><option value="centralus">Central US</option><option value="westus2">West US 2</option></select></div>
      <div><label>Environment Tier</label><select name="env" style="width:100%"><option value="prod1" selected>Production (prod1)</option><option value="test1">Testing / QA (test1)</option><option value="dev1">Development (dev1)</option></select></div>
      <div><label>Work Solution</label><select name="solution" style="width:100%">${SOL.map(s=>`<option value="${s.id}">${s.name}</option>`).join("")}</select></div>
      <div><label>Storage Quota (GB)</label><input name="storage" type="number" value="500" style="width:100%"></div>
      <div><label>Monthly Spend Limit (USD)</label><input name="spend" type="number" value="5000" style="width:100%"></div>
      <div><button class="btn lg" style="width:100%;background:var(--blue);font-weight:700">+ Provision Dedicated Tenant</button></div>
    </form>
    ${err}
  </div>

  <div class="card flush">
    <div style="padding:14px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center">
      <h3 style="margin:0">Active Dedicated Client Tenants</h3>
      <span class="log">Total: ${totalTenants} isolated environments</span>
    </div>
    <table>
      <tr><th>Client Tenant</th><th>Solution</th><th>Azure Environment</th><th>Admin & People</th><th>Spend Limit</th><th>Status</th><th></th></tr>
      ${S.accounts.map(a=>{
        const adminUser = accountUsers(a).find(u=>u.role==="admin") || accountUsers(a)[0];
        const isCurrent = (acct() && acct().id === a.id);
        return `<tr>
          <td><b>${esc(a.name)}</b> <span class="chip ok" style="font-size:10px;padding:1px 6px">Dedicated</span><br><span class="log">Created ${a.created||a.created_at||"2026-11-05"}</span></td>
          <td>${SOL.find(s=>s.id===a.solution)?.name||a.solution}</td>
          <td><span style="font-family:monospace;font-size:12px">rg-${esc(a.id)}-${a.env||"prod1"}</span><br><span class="log">${a.region} · Single-Tenant</span></td>
          <td>${adminUser ? `<b>${esc(adminUser.name||adminUser.email)}</b><br><span class="log">${esc(adminUser.email)}</span>` : `<span class="log">${accountUsers(a).length} users</span>`}</td>
          <td>$${a.usage.spendUsd.toLocaleString()} / $${a.resources.spendLimitUsd.toLocaleString()}<br><span class="log">${a.resources.storageGb} GB Storage</span></td>
          <td><span class="chip ${chip(a.status)}">${a.status==="ready"?"Active / Ready":a.status}</span></td>
          <td class="r">${isCurrent ? `<span class="pill" style="color:var(--blue);font-weight:600">Current</span>` : `<button class="btn ghost sm" data-act="openAccount" data-v="${a.id}">Switch Tenant</button>`}</td>
        </tr>`;
      }).join("")}
    </table>
  </div>
</div>`;
}

/* ============================== demos (linked from flows.html) ============================== */

  C6:()=>{ login("bill@alidainc.com","ad"); return "/app/admin/people"; },

/* ============================== render ============================== */
function render(){
  R=parseHash(); const p=R.parts[0]||""; const u=me();
  if(p==="demo"){ const f=DEMOS[R.parts[1]]; const to=f?f():"/"; save(); nav(to,true); return; }
  const needUser=["onboard","provisioning","app"];
  if(needUser.includes(p)&&!u){ nav("/login",true); return; }
  if(p==="register"){ nav("/login",true); return; }
  if(p==="login"&&u){ nav(landing(),true); return; }
  if(p==="onboard"){ const aid=u.accountId||u.account_id; if(u.role!=="staff"&&aid){ nav(landing(),true); return; } if(!onb()) startOnboarding(u.role==="staff"?"staff":"sales"); }
  if(p==="app"){
    const sub=R.parts[1]||"";
    if(u.role==="staff"&&!S.acting&&sub!=="accounts"){ nav("/app/accounts",true); return; }
    if(sub==="accounts"&&u.role!=="staff"&&u.role!=="admin"){ nav("/app",true); return; }
    if(sub!=="accounts"){ const a=acct(); if(!a){ nav(landing(),true); return; } if(a.status!=="ready"){ nav("/provisioning",true); return; } }
    if(sub==="admin"&&!isAdmin()){ nav("/app",true); return; }
    if(sub==="admin"&&(R.parts[2]==="approvals"||R.parts[2]==="sandboxes")){ nav("/app/admin/setup",true); return; }
  }
  $("#hdr").innerHTML=topbar();
  const app=$("#app"); const sc=app.querySelector(".content,.site")?.scrollTop||0;
  let html;
  if(PUBLIC.includes(p)) html={"":vHome,see:vSee,learn:vLearn,understand:vUnderstand,partner:vPartner,register:vRegister,login:vLogin}[p]();
  else if(p==="onboard") html=`<div class="shell plain">${vOnboard()}</div>`;
  else if(p==="provisioning") html=`<div class="shell plain">${vProvisioning()}</div>`;
  else if(p==="app"){ const sub=R.parts[1]||""; let main;
    if(sub==="accounts") main=vAccounts(); else if(sub==="") main=vOverview(); else if(AD_PAGES[sub]) main=vVerb(sub); else if(sub==="admin") main=vAdmin(R.parts[2]||"setup"); else main=`<div class="content">${empty("Not found.")}</div>`;
    html=`<div class="shell">${sidebar()}${main}${sub==="accounts"?"":dock()}</div>`; }
  else html=vHome();
  app.innerHTML=html;
  const pg=app.querySelector(".content,.site"); if(pg&&p===lastPage) pg.scrollTop=sc; lastPage=p;
  document.querySelectorAll(".chat").forEach(c=>c.scrollTop=c.scrollHeight);
  const term=document.getElementById("pipeline-terminal"); if(term) term.scrollTop=term.scrollHeight;
}
let lastPage="";

/* ============================== events ============================== */
const g=id=>document.getElementById(id);
const direct=(changes,okMsg)=>{ const o=createOrder(acct(),changes,"dashboard",{direct:true}); S.ui.cfgErr=o.status==="invalid"?o.validation.errors.join(" "):""; if(!S.ui.cfgErr) toast(okMsg||"Saved"); };
const ACT={
  home:()=>nav(me()?landing():"/"), signout:()=>{logout();delete S.provisioning;save();nav("/");},
  forceReady:()=>{
    const a=acct();
    if(a) a.status="ready";
    let o=S.orders.find(x=>x.id===S.provisioning||(a&&x.accountId===a.id));
    if(o){ o.status="applied"; o.jobs.forEach(j=>j[1]="done"); }
    delete S.provisioning;
    save();
    nav("/app");
  },
  loadTfvars:el=>{
    const out=g("tfvars-out"); if(!out) return;
    out.style.display="block"; out.textContent="Loading generated infrastructure.tfvars from backend...";
    fetch('/api/accounts/'+el.dataset.v+'/tfvars').then(r=>r.json()).then(d=>{ out.textContent=d.content||"No tfvars generated."; }).catch(()=>{ out.textContent="Backend offline."; });
    return "norender";
  },
  toggleDock:()=>{ S.ui.dock = !(S.ui.dock !== false); save(); },
  selectAssistant:el=>{ if(el.value==="toggle"){ S.ui.dock=false; } else { S.ui.activeChat=el.value; S.ui.dock=true; } save(); },
  switchChat:el=>{ S.ui.activeChat = el.dataset.v; S.ui.dock = true; save(); },
  switchAcct:el=>{S.acting=el.value||null;save();nav(el.value?"/app":"/app/accounts");},
  chooseSol:el=>{onb().d.solution=el.dataset.v;save();},
  onbNext:()=>{ const o=onb(); S.ui.onbErr=onbValidate(o.step); if(!S.ui.onbErr) o.step++; save(); },
  onbBack:()=>{S.ui.onbErr="";onb().step--;save();},
  onbCancel:()=>{ if(me().role==="staff"){delete S.onbs.staff;save();nav("/app/accounts");} else {save();logout();nav("/");} },
  onbConfirm:()=>{ S.ui.onbErr=[1,2,4].map(onbValidate).find(Boolean)||""; save(); if(!S.ui.onbErr){confirmOnboarding();return "norender";} },
  onbAddUser:()=>{ const v=g("onbUser").value.trim(); const d=onb().d; if(!/^\S+@\S+\.\S+$/.test(v)){S.ui.onbErr="Enter a valid email.";return;} if(v===d.adminEmail||d.users.some(u=>u.email===v)||S.users.some(u=>u.email===v&&u.accountId)){S.ui.onbErr="Already listed or belongs to another account.";return;} S.ui.onbErr=""; d.users.push({email:v,admin:false}); save(); },
  onbRmUser:el=>{onb().d.users.splice(+el.dataset.v,1);save();}, onbAdmin:el=>{onb().d.users[+el.dataset.v].admin=el.checked;save();},
  openAccount:el=>{S.acting=el.dataset.v;save();nav("/app");},
  addDomain:()=>direct([{op:"add",target:"domain",id:g("nd").value}],"Domain added"), rmDomain:el=>{ if(confirm("Remove domain "+(REGISTRY[el.dataset.v]||el.dataset.v)+"?")) direct([{op:"remove",target:"domain",id:el.dataset.v}],"Domain removed"); },
  addSandbox:()=>direct([{op:"add",target:"sandbox",name:g("ns").value.trim(),mode:g("nm").value,quotaGb:+g("nq").value}],"Sandbox added"), rmSandbox:el=>{ if(confirm("Remove sandbox "+el.dataset.v+"?")) direct([{op:"remove",target:"sandbox",name:el.dataset.v}],"Sandbox removed"); },
  addUser:()=>direct([{op:"add",target:"user",email:g("nu").value.trim(),role:g("nur").value}],"Invitation sent"), rmUser:el=>{ if(confirm("Remove "+el.dataset.v+"?")) direct([{op:"remove",target:"user",email:el.dataset.v}],"Removed"); }, setRole:el=>direct([{op:"set",target:"user",email:el.dataset.v,role:el.value}],"Role updated"),
  setRes:()=>direct([{op:"set",target:"resources",value:{spendLimitUsd:+g("rs").value,storageGb:+g("rg").value}}],"Allocation saved"),
  selOrder:el=>{S.ui.orderId=el.dataset.v;S.ui.editing=null;save();}, approve:el=>{approveOrder(S.orders.find(o=>o.id===el.dataset.v));return "norender";}, reject:el=>{rejectOrder(S.orders.find(o=>o.id===el.dataset.v));return "norender";},
  edit:el=>{S.ui.editing=el.dataset.v;S.ui.orderId=el.dataset.v;save();}, doneEdit:()=>{S.ui.editing=null;save();},
  dropChange:el=>{ const o=S.orders.find(o=>o.id===S.ui.editing); o.changes.splice(+el.dataset.v,1); o.validation=validate(acct(o.accountId),o.changes); o.status=o.validation.ok?"pending":"invalid"; log("config-order.edited",o.id); save(); },
  editNum:el=>{ const o=S.orders.find(o=>o.id===S.ui.editing); const c=o.changes[+el.dataset.i]; if(c.target==="resources") c.value[el.dataset.k]=+el.value; else c[el.dataset.k]=+el.value; o.validation=validate(acct(o.accountId),o.changes); o.status=o.validation.ok?"pending":"invalid"; log("config-order.edited",o.id); save(); },
  sugg:el=>sendChat(el.dataset.chat,el.dataset.v)
};
function sendChat(id,text){ if(!text) return; if(id==="sales") salesySay(text); else if(id==="cfg") configgySay(text); else if(id==="ad") adySay(text); }
document.body.addEventListener("click",e=>{ const an=e.target.closest('a[href^="#/"]'); if(an&&!HASH_OK){ e.preventDefault(); nav(an.getAttribute("href").slice(1)); return; } const el=e.target.closest("[data-act]"); if(!el||e.target.closest("a[href]")) return; if(el.tagName==="SELECT"||el.tagName==="INPUT") return; e.preventDefault(); const r=ACT[el.dataset.act]?.(el); if(r!=="norender") render(); });
document.body.addEventListener("change",e=>{ const el=e.target; if(el.dataset.bind&&onb()){ onb().d[el.dataset.bind]=el.value; save(); return; } if(el.dataset.act&&ACT[el.dataset.act]){ ACT[el.dataset.act](el); render(); } });
document.body.addEventListener("submit",e=>{ e.preventDefault(); const f=e.target; const fd=new FormData(f);
  if(f.dataset.chat){ const inp=f.querySelector("input"); const v=inp.value.trim(); inp.value=""; sendChat(f.dataset.chat,v); render(); return; }
  if(f.dataset.form==="adminCreateAccount"){
    const org = fd.get("org").trim();
    const name = fd.get("name").trim();
    const email = fd.get("email").trim().toLowerCase();
    const region = fd.get("region") || "eastus2";
    const env = fd.get("env") || "prod1";
    const solution = fd.get("solution") || "data-foundation";
    const storage = +fd.get("storage") || 500;
    const spend = +fd.get("spend") || 5000;
    const id = "acct-" + org.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
    if(S.accounts.some(x=>x.id===id||x.name.toLowerCase()===org.toLowerCase())){
      S.ui.adminProvErr = "A tenant with this organization name already exists.";
      render(); return;
    }
    const newAcct = {
      id, name: org, solution, region, env, tenancy: "single", management: "fully", status: "ready",
      domains: ["gendf"], sandboxes: [{name: "sbx-main", mode: "dedicated", quotaGb: 100}],
      resources: {spendLimitUsd: spend, storageGb: storage},
      usage: {spendUsd: 0, computeHours: 0}, datasets: [], created: now().slice(0,10)
    };
    S.accounts.unshift(newAcct);
    const existingU = S.users.find(u=>u.email===email);
    if(existingU){ existingU.accountId = id; existingU.role = "admin"; }
    else { S.users.push({email, name, password: "welcome", accountId: id, role: "admin", org}); }
    
    log("admin-provision-dedicated-tenant", id);
    toast("Dedicated tenant provisioned: " + org);
    S.ui.adminProvErr = "";
    save();
    
    if(window.fetch){
      fetch('/api/auth/register',{
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({name, org, email, password: "welcome", region, tenancy: "single", env, storage, sandbox: "sbx-main", quota: 100, spend})
      }).catch(e=>console.log("Backend register error:", e));
    }
    render();
    return;
  }
  if(f.dataset.form==="register"){
    const name = fd.get("name").trim();
    const org = fd.get("org").trim();
    const email = fd.get("email").trim().toLowerCase();
    const password = fd.get("password");
    const region = fd.get("region") || "eastus2";
    const tenancy = fd.get("tenancy") || "single";
    const env = fd.get("env") || "dev1";
    S.ui.authErr = register(name, org, email, password);
    save();
    if(S.ui.authErr) {
      render();
    } else {
      const o = onb();
      if(o && o.d) {
        o.d.region = region;
        o.d.tenancy = tenancy;
        o.d.env = env;
      }
      confirmOnboarding();
      if(window.fetch){
        fetch('/api/auth/register',{
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body:JSON.stringify({name, org, email, password, region, tenancy, env, storage:500, sandbox:"sbx-main", quota:100, spend:5000})
        }).then(r=>r.json()).then(res=>{
          if(res.ok && res.state && res.state.users){
            S.users = res.state.users;
            save();
          }
        }).catch(()=>{});
      }
    }
  }
  if(f.dataset.form==="login"){
    const email = fd.get("email").trim().toLowerCase();
    const password = fd.get("password");
    if(window.fetch){
      fetch('/api/auth/login',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({email, password})
      })
      .then(r => r.json())
      .then(res => {
        if(res.ok && res.user){
          res.user.accountId = res.user.accountId || res.user.account_id;
          const idx = S.users.findIndex(u => u.email.toLowerCase() === res.user.email.toLowerCase());
          if(idx >= 0) S.users[idx] = Object.assign(S.users[idx], res.user);
          else S.users.push(res.user);
          if(res.state && res.state.accounts) {
            res.state.accounts.forEach(a => {
              const aidx = S.accounts.findIndex(x => x.id === a.id);
              if(aidx >= 0) S.accounts[aidx] = Object.assign(S.accounts[aidx], a);
              else S.accounts.push(a);
            });
          }
          S.session = {email: res.user.email};
          S.ui.dock = true;
          if(res.user.role === "staff") S.acting = null;
          else S.acting = res.user.accountId;
          save();
          nav(landing());
        } else {
          S.ui.authErr = res.detail || "Wrong email or password.";
          render();
        }
      })
      .catch(() => {
        S.ui.authErr = login(email, password);
        save();
        if(S.ui.authErr) render(); else nav(landing());
      });
    } else {
      S.ui.authErr = login(email, password);
      save();
      if(S.ui.authErr) render(); else nav(landing());
    }
  }
});
window.addEventListener("hashchange",render);
render();
</script>
