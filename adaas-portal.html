<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AD as a Service — portal prototype</title>
<style>
:root{--navy:#14213d;--ink:#1f2933;--blue:#0b5cad;--blue2:#084a8c;--ice:#c7d3e3;--bg:#f4f6f8;--line:#d9dee5;--slate:#5f6b7a;--green:#1a7f4b;--amber:#9a6700;--red:#b42318;--sans:"Segoe UI",-apple-system,"Helvetica Neue",Arial,sans-serif}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:var(--sans);color:var(--ink);background:var(--bg);font-size:14px;display:flex;flex-direction:column;overflow:hidden}
header{height:56px;background:var(--navy);color:#fff;display:flex;align-items:center;padding:0 20px;gap:22px;flex:none}
.brand{font-weight:700;font-size:16px;white-space:nowrap}.brand span{font-weight:400;color:var(--ice);margin-left:6px;font-size:13px}
.spacer{flex:1}
.link{all:unset;cursor:pointer;color:var(--ice);font-size:13px;padding:5px 10px;border-radius:3px;border:1px solid transparent}.link:hover{border-color:#3a4a6b}
#session{font-size:12px;color:var(--ice);display:flex;gap:10px;align-items:center;white-space:nowrap}
/* timeline */
.tl{display:flex;align-items:center}
.tl .n{display:flex;align-items:center;gap:8px;padding:0 12px;height:56px;color:#7f8ca3;font-size:13px;font-weight:600;position:relative;white-space:nowrap}
.tl .n .d{width:10px;height:10px;border-radius:50%;background:#44536f;flex:none}
.tl .n.avail{color:var(--ice);cursor:pointer}.tl .n.avail .d{background:var(--ice)}
.tl .n.active{color:#fff}.tl .n.active .d{background:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.25)}
.tl .n.done{color:#9aa7bd;cursor:pointer}.tl .n.done .d{background:var(--green)}
.tl .n.off{opacity:.45}
.tl .n.lock .d{background:#44536f;border:2px solid #7f8ca3}
.tl .seg{width:26px;height:2px;background:#44536f}
.tl .sub{display:flex;gap:2px;margin-left:6px;padding-left:10px;border-left:1px solid #3a4a6b}
.tl .sub button{all:unset;cursor:pointer;font-size:11px;padding:3px 8px;border-radius:3px;color:#9aa7bd}.tl .sub button.on{background:rgba(255,255,255,.14);color:#fff}
.tl .n small{font-weight:400;font-size:11px;color:#7f8ca3}
#app{flex:1;min-height:0;display:flex}
.page{flex:1;overflow:auto;padding:26px 32px}
.split{flex:1;min-height:0;display:grid;grid-template-columns:380px 1fr}
.agent{background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.agent .head{padding:12px 16px;border-bottom:1px solid var(--line)}.agent .head b{font-size:14px;color:var(--navy)}
.agent .head small{display:block;color:var(--slate);margin-top:2px;font-size:12px}
.chat{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px;background:#fafbfc}
.msg{max-width:92%;padding:8px 11px;border-radius:4px;font-size:13px;line-height:1.45;white-space:pre-wrap}
.msg.u{align-self:flex-end;background:var(--blue);color:#fff}.msg.a{align-self:flex-start;background:#fff;border:1px solid var(--line)}
.msg.s{align-self:center;background:transparent;color:var(--slate);font-size:12px;font-style:italic}
.msg .mini{margin-top:8px;border-top:1px solid var(--line);padding-top:8px;font-size:12px}
.chat-in{border-top:1px solid var(--line);padding:10px;display:flex;gap:8px}.chat-in input{flex:1}
.sugg{padding:8px 12px;display:flex;flex-wrap:wrap;gap:6px;border-top:1px solid var(--line)}
.sugg button{all:unset;cursor:pointer;font-size:12px;border:1px solid var(--line);border-radius:3px;padding:2px 8px;color:var(--blue)}.sugg button:hover{background:#eaf1f9}
h1{margin:0 0 6px;font-size:26px;font-weight:600;color:var(--navy)}
h2{margin:0 0 2px;font-size:20px;font-weight:600;color:var(--navy)}
.sub{color:var(--slate);margin:0 0 16px}
.mode{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:3px;margin-bottom:10px}
.mode.sales{background:#fdf1d6;color:var(--amber)}.mode.config{background:#e1ecf8;color:var(--blue)}.mode.ad{background:#e3f4ea;color:var(--green)}.mode.staff{background:#eceff3;color:var(--slate)}
.card{background:#fff;border:1px solid var(--line);border-radius:4px;padding:16px 18px;margin-bottom:16px}
.card h3{margin:0 0 10px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--slate);font-weight:600}
.grid{display:grid;gap:16px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr 1fr}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--slate);padding:8px 10px;border-bottom:1px solid var(--line);background:#fafbfc;font-weight:600}
td{padding:9px 10px;border-bottom:1px solid #edf0f3;vertical-align:middle}
tr.click{cursor:pointer}tr.click:hover td{background:#f7f9fb}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:1px 8px;border-radius:3px;background:#eceff3;color:var(--slate)}
.chip.ok{background:#e3f4ea;color:var(--green)}.chip.warn{background:#fdf1d6;color:var(--amber)}.chip.bad{background:#fbe4e1;color:var(--red)}.chip.run{background:#e1ecf8;color:var(--blue)}
.btn{all:unset;cursor:pointer;background:var(--blue);color:#fff;padding:7px 14px;border-radius:3px;font-weight:600;font-size:13px;white-space:nowrap}
.btn:hover{background:var(--blue2)}.btn.ghost{background:#fff;color:var(--blue);border:1px solid var(--blue)}
.btn.red{background:#fff;color:var(--red);border:1px solid var(--red)}.btn.sm{padding:4px 10px;font-size:12px}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.kv{display:grid;grid-template-columns:130px 1fr;gap:6px 12px}.kv b{color:var(--slate);font-weight:500}
input,select{font:inherit;padding:6px 8px;border:1px solid #b9c2cd;border-radius:3px;background:#fff;color:var(--ink)}
input:focus,select:focus{outline:2px solid #9cc2ea;border-color:var(--blue)}
label{display:block;font-size:12px;font-weight:600;color:var(--slate);margin:10px 0 4px}
pre{background:#f6f8fa;color:#24292f;border:1px solid var(--line);border-radius:3px;padding:12px;font-size:12px;line-height:1.5;overflow:auto;max-height:320px;margin:0}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px}
.tabs button{all:unset;cursor:pointer;padding:8px 14px;font-weight:500;color:var(--slate);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--navy);border-bottom-color:var(--blue);font-weight:600}
.tabs .badge{background:var(--blue);color:#fff;font-size:11px;border-radius:10px;padding:0 6px;margin-left:6px}
.pill{display:inline-block;background:#eceff3;border-radius:3px;padding:1px 7px;margin:0 4px 4px 0;font-size:12px}
.steps{list-style:none;padding:0;margin:0}.steps li{display:grid;grid-template-columns:18px 1fr;gap:8px;padding:5px 0}
.dot{width:12px;height:12px;border-radius:50%;background:var(--line);margin-top:4px}.dot.done{background:var(--green)}.dot.run{background:var(--blue);animation:p 1s infinite}
@keyframes p{50%{opacity:.35}}
.log{font-size:12px;color:var(--slate)}.err{color:var(--red);font-size:13px}.warn{color:var(--amber);font-size:13px}.empty{color:var(--slate)}
.note{background:#fdf1d6;border:1px solid #ecd48b;color:#6b4e00;border-radius:3px;padding:8px 12px;font-size:13px;margin:10px 0}
.info{background:#e1ecf8;border:1px solid #b9d1ee;color:#1d4e89;border-radius:3px;padding:8px 12px;font-size:13px;margin:10px 0}
.bar{height:8px;background:#eceff3;border-radius:2px;overflow:hidden}.bar i{display:block;height:100%;background:var(--blue)}.bar i.warn{background:var(--amber)}.bar i.bad{background:var(--red)}
.diff{font:13px/1.7 ui-monospace,Menlo,monospace}.diff .a{color:var(--green)}.diff .r{color:var(--red)}.diff .c{color:var(--amber)}
.diff .x{all:unset;cursor:pointer;color:var(--red);margin-left:8px;font-weight:700}
.diff input{width:80px;padding:1px 4px;font-size:12px}
/* portal */
.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:28px;max-width:1180px}
.can{list-style:none;padding:0;margin:0 0 20px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.can li{background:#fff;border:1px solid var(--line);border-radius:4px;padding:10px 12px;font-weight:500}
.klist{list-style:none;padding:0;margin:0}.klist li{padding:7px 0;border-bottom:1px solid #edf0f3;color:var(--ink)}
.chatcard{display:flex;flex-direction:column;height:520px;padding:0}
.chatcard .head{padding:12px 16px;border-bottom:1px solid var(--line)}.chatcard .head b{color:var(--navy)}.chatcard .head small{display:block;color:var(--slate);font-size:12px}
/* sign in */
.users{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;max-width:960px}
.user{background:#fff;border:1px solid var(--line);border-radius:4px;padding:16px;cursor:pointer}.user:hover{border-color:var(--blue)}
.user b{display:block;color:var(--navy)}.user small{color:var(--slate)}
/* wizard */
.wiz{display:grid;grid-template-columns:220px 1fr;gap:24px}
.wiz ol{list-style:none;padding:0;margin:0}.wiz ol li{padding:8px 10px;border-left:3px solid transparent;color:var(--slate)}
.wiz ol li.on{border-left-color:var(--blue);color:var(--navy);font-weight:600;background:#eaf1f9}.wiz ol li.done{color:var(--green)}
.sol{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sol div{border:1px solid var(--line);border-radius:4px;padding:12px;cursor:pointer;background:#fff}.sol div.on{border-color:var(--blue);background:#eaf1f9}
.sol b{display:block;color:var(--navy);margin-bottom:4px}.sol small{color:var(--slate)}
/* landing */
.choose{display:grid;grid-template-columns:1fr 1fr;gap:20px;max-width:820px}
.choose div{background:#fff;border:1px solid var(--line);border-radius:4px;padding:24px;cursor:pointer}.choose div:hover{border-color:var(--blue)}
.choose h3{margin:0 0 6px;font-size:18px;color:var(--navy);text-transform:none;letter-spacing:0}.choose p{margin:0;color:var(--slate)}
/* modal */
#modal{position:fixed;inset:0;background:rgba(20,33,61,.45);display:flex;align-items:center;justify-content:center;z-index:10}
#modal[hidden]{display:none}
.mbox{background:#fff;border-radius:4px;width:820px;max-height:85vh;overflow:auto;padding:22px 26px}
.mbox h2{margin-bottom:12px}
.flow{display:grid;grid-template-columns:54px 1fr auto;gap:12px;padding:10px 0;border-bottom:1px solid #edf0f3;align-items:center}
.flow b{color:var(--navy)}.flow small{color:var(--slate);display:block}
</style>
</head>
<body>
<header>
  <div class="brand">AD<span>as a Service</span></div>
  <div class="tl" id="timeline"></div>
  <div class="spacer"></div>
  <button class="link" data-act="flows">Flows</button>
  <div id="session"></div>
</header>
<div id="app"></div>
<div id="modal" hidden></div>

<script>
/* ===================== data ===================== */
const REGISTRY={gendf:"GenDF Domain","readygo-retail":"ReadyGo Retail","readygo-finance":"ReadyGo Finance","readygo-healthcare":"ReadyGo Healthcare","transaction-enhancer":"Transaction Enhancer"};
const REGIONS=["eastus2","westus3","centralus"];
const MAX_SPEND=50000;
const SOL=[
 {id:"data-foundation",name:"Produce a Data Foundation",blurb:"Integrated, peered datasets with rich metadata. The default work solution.",domains:["gendf"],verbs:["DATA","PRODUCE","EXPLORE","GENERATE"]},
 {id:"explore-industry",name:"Explore Industry Datasets",blurb:"Subscribe to curated datasets and explore them. No Produce.",domains:["gendf","readygo-retail"],verbs:["EXPLORE"]},
 {id:"byod",name:"Explore Your Own Data (BYOD)",blurb:"Import your own datasets and explore them.",domains:["gendf"],verbs:["DATA","EXPLORE"]},
 {id:"transaction",name:"Add Per-Transaction Value",blurb:"JIT transaction processing with recommendations per transaction.",domains:["gendf","transaction-enhancer"],verbs:["PRODUCE"]}
];
const KNOW={
 SEE:["Produce Automated (Large Scale) Data Solutions","Augment Your Technical Capabilities","Produce Deterministic Adaptive Self-Healing Pipelines","Extract Actionable Value from Datasets","Explore Datasets (Industry or BYOD) / Sell Datasets","Add Per Transaction Value Using Your Own Data","Create Cloud AI Automation Apps","Or Start Small, One Step at a Time"],
 LEARN:["What is AD?","What does AD do?","What are the cycles behind AD that help you?","How does it fit in your workflow?","What is Collaborative Interaction?","What is Collaborative Intelligence?","What are Capabilities and Process Augmentation?","Take an AD Tour"],
 UNDERSTAND:["What is Safe AI?","What is a deterministic, repeatable result?","Are you in control of the process run by AI?","What are AD work orders?","How are AD work orders verified?","Can verified processes be executed automatically?","How does AD adapt?","Let AD show you how safe AI works"],
 PARTNER:["Choose from a variety of WORK solutions or create your own","Create an account","Choose your spending limits","Provide a list of AD users","Allow AD to set up your account & access","Tailor AD environment options","Take a tour of your new AD environment","Run your first job"]
};
const WIZ=["Work solution","Account","Spending limit","Users","Environment","Review & confirm"];

function seed(){
  return {
    stage:"portal", kTab:"SEE", adTab:"data", cfgTab:"overview", session:null, onb:null, onbErr:"", editing:null,
    seq:{so:1,co:1,wo:1,ds:3},
    salesChat:[{r:"a",t:"Hi, I'm Salesy, the AD Sales agent. I can explain what AD can do, how it works and why it's safe, or get you started with an account."}],
    cfgChat:{}, adChat:{},
    accounts:[{id:"alida-internal",name:"Alida Internal (first client)",solution:"data-foundation",region:"eastus2",tenancy:"single",management:"fully",status:"ready",
      domains:["gendf","readygo-retail"],sandboxes:[{name:"sbx-main",mode:"dedicated",quotaGb:100}],
      users:[{name:"Bill Sequeira",email:"bill@alidainc.com",role:"admin"},{name:"Dhananjay Goel",email:"dhananjay@alidainc.com",role:"user"}],
      resources:{spendLimitUsd:5000,storageGb:500},usage:{spendUsd:1840,computeHours:62},
      datasets:[{name:"retail_orders_2025",gb:12.4,src:"UC"},{name:"store_master",gb:0.3,src:"import"}],created:"2026-11-20"}],
    orders:[{id:"CO-0001",accountId:"alida-internal",kind:"provision",source:"staff",requestedBy:"staff@alidainc.com",status:"applied",created:"2026-11-20 09:12",
      changes:[{op:"provision",target:"environment",value:"eastus2 · single-tenant · fully managed"},{op:"add",target:"domain",id:"gendf"},{op:"add",target:"domain",id:"readygo-retail"},{op:"add",target:"sandbox",name:"sbx-main",mode:"dedicated",quotaGb:100},{op:"add",target:"user",email:"bill@alidainc.com",role:"admin"}],
      jobs:[["Validate sales order","done"],["Environment setup (ADAzEnvConfig)","done"],["Service configuration (ADSvcConfig)","done"],["Jumpstart AD","done"],["Verify","done"]]}],
    works:[{id:"WO-0001",accountId:"alida-internal",by:"dhananjay@alidainc.com",verb:"PRODUCE",text:"Produce a data foundation from retail_orders_2025",status:"done",result:"Domain job results: 2 datasets integrated, 14 entities, 38 transformations logged."}],
    audit:[{t:"2026-11-20 09:31",actor:"orchestrator",action:"config-order.applied",ref:"CO-0001"},{t:"2026-11-20 09:14",actor:"staff@alidainc.com",action:"config-order.approved",ref:"CO-0001"},{t:"2026-11-20 09:12",actor:"staff@alidainc.com",action:"sales-order.received",ref:"SO-0001"}]
  };
}
let S=seed();
const STAFF={name:"Alida staff",email:"staff@alidainc.com",role:"staff"};

/* ===================== helpers ===================== */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const acct=id=>S.accounts.find(a=>a.id===(id||S.session?.accountId));
const nid=k=>{const p={so:"SO",co:"CO",wo:"WO",ds:"DS"}[k];return p+"-"+String(++S.seq[k]).padStart(4,"0");};
const now=()=>new Date().toISOString().slice(0,16).replace("T"," ");
const log=(action,ref,actor)=>S.audit.unshift({t:now(),actor:actor||S.session?.email||"visitor",action,ref});
const chip=st=>({applied:"ok",ready:"ok",done:"ok",pending:"warn",queued:"warn",provisioning:"run",running:"run",rejected:"bad",failed:"bad"}[st]||"");
const isAdmin=()=>S.session&&(S.session.role==="admin"||S.session.role==="staff");
const allUsers=()=>S.accounts.flatMap(a=>a.users.map(u=>({...u,accountId:a.id,accountName:a.name})));

function describe(c){
  if(c.op==="provision") return "provision environment: "+c.value;
  if(c.target==="domain") return (c.op==="add"?"+ ":"− ")+"domain "+(REGISTRY[c.id]||c.id);
  if(c.target==="sandbox") return (c.op==="add"?`+ sandbox ${c.name} (${c.mode}, ${c.quotaGb} GB)`:`− sandbox ${c.name}`);
  if(c.target==="user") return c.op==="add"?`+ user ${c.email} as ${c.role}`:c.op==="remove"?`− user ${c.email}`:`~ user ${c.email} → ${c.role}`;
  if(c.target==="resources") return "~ allocation "+Object.entries(c.value).map(([k,v])=>`${k}=${v}`).join(", ");
  return JSON.stringify(c);
}
function validate(a,changes){
  const errors=[],warnings=[];
  const doms=new Set(a.domains),sbx=new Map(a.sandboxes.map(s=>[s.name,s])),usr=new Map(a.users.map(u=>[u.email,u]));
  let used=a.sandboxes.reduce((n,s)=>n+s.quotaGb,0),cap=a.resources.storageGb;
  if(!changes.length) errors.push("The order contains no changes.");
  for(const c of changes){
    if(c.target==="domain"){ if(c.op==="add"){ if(!REGISTRY[c.id]) errors.push(`Domain "${c.id}" is not in the registry.`); else if(doms.has(c.id)) warnings.push(`${c.id} already present.`); else doms.add(c.id);} else { if(!doms.has(c.id)) errors.push(`Domain ${c.id} is not present.`); else doms.delete(c.id);} }
    else if(c.target==="sandbox"){ if(c.op==="add"){ if(sbx.has(c.name)) errors.push(`Sandbox ${c.name} already exists.`); else {used+=+c.quotaGb; sbx.set(c.name,c);} } else { if(!sbx.has(c.name)) errors.push(`Sandbox ${c.name} is not present.`); else {used-=sbx.get(c.name).quotaGb; sbx.delete(c.name);} } }
    else if(c.target==="user"){ if(!/^\S+@\S+\.\S+$/.test(c.email)) errors.push("Invalid email: "+c.email);
      else if(c.op==="add"){ if(usr.has(c.email)) warnings.push(c.email+" is already a user."); else usr.set(c.email,{email:c.email,role:c.role}); }
      else if(c.op==="remove"){ if(!usr.has(c.email)) errors.push(c.email+" is not a user."); else usr.delete(c.email); }
      else if(c.op==="set"){ if(!usr.has(c.email)) errors.push(c.email+" is not a user."); else usr.set(c.email,{email:c.email,role:c.role}); } }
    else if(c.target==="resources"){ if(c.value.spendLimitUsd!=null){ if(c.value.spendLimitUsd>MAX_SPEND) errors.push(`Spend limit above policy maximum ($${MAX_SPEND.toLocaleString()}).`);} if(c.value.storageGb!=null) cap=c.value.storageGb; }
  }
  if(used>cap) errors.push(`Sandbox quota ${used} GB exceeds storage allocation ${cap} GB.`);
  if(![...usr.values()].some(u=>u.role==="admin")) errors.push("An account must keep at least one admin.");
  return {ok:!errors.length,errors,warnings};
}
function apply(a,changes){
  for(const c of changes){
    if(c.target==="domain"){ if(c.op==="add"&&!a.domains.includes(c.id)) a.domains.push(c.id); if(c.op==="remove") a.domains=a.domains.filter(x=>x!==c.id); }
    else if(c.target==="sandbox"){ if(c.op==="add") a.sandboxes.push({name:c.name,mode:c.mode,quotaGb:+c.quotaGb}); else a.sandboxes=a.sandboxes.filter(x=>x.name!==c.name); }
    else if(c.target==="user"){ if(c.op==="add"&&!a.users.some(u=>u.email===c.email)) a.users.push({name:c.name||c.email.split("@")[0],email:c.email,role:c.role}); if(c.op==="remove") a.users=a.users.filter(u=>u.email!==c.email); if(c.op==="set"){const u=a.users.find(u=>u.email===c.email); if(u) u.role=c.role;} }
    else if(c.target==="resources") Object.assign(a.resources,c.value);
  }
}
function createOrder(a,changes,source,opts={}){
  const v=validate(a,changes);
  const o={id:nid("co"),accountId:a.id,kind:opts.kind||"change",source,requestedBy:S.session?.email||"visitor",status:v.ok?(opts.direct?"applied":"pending"):"invalid",validation:v,changes,jobs:[],created:now(),note:opts.note||""};
  S.orders.unshift(o); log("config-order.created ("+source+")",o.id);
  if(v.ok&&opts.direct){ apply(a,changes); log("config-order.applied (direct, dashboard)",o.id); }
  return o;
}
function approve(o){
  const a=acct(o.accountId); const v=validate(a,o.changes);
  if(!v.ok){ o.validation=v; o.status="invalid"; render(); return; }
  o.status="running"; log("config-order.approved",o.id);
  o.jobs=[["Service configuration (ADSvcConfig)","pending"],["Verify","pending"]]; render();
  runJobs(o,()=>{ apply(a,o.changes); o.status="applied"; log("config-order.applied",o.id,"orchestrator"); render(); });
}
function reject(o){ o.status="rejected"; log("config-order.rejected",o.id); render(); }
function runJobs(o,done,i=0){
  if(i>=o.jobs.length){ done(); return; }
  o.jobs[i][1]="run"; render();
  setTimeout(()=>{ o.jobs[i][1]="done"; log("job.done · "+o.jobs[i][0],o.id,"orchestrator"); render(); runJobs(o,done,i+1); },1000);
}

/* ===================== session & navigation ===================== */
function signIn(email){
  if(email===STAFF.email){ S.session={...STAFF,accountId:null}; S.stage="staff"; log("sign-in (staff)","portal",email); return; }
  const u=allUsers().find(u=>u.email===email); if(!u) return;
  S.session={name:u.name,email:u.email,role:u.role,accountId:u.accountId};
  S.stage=u.role==="admin"?"landing":"ad"; log("sign-in ("+u.role+")",u.accountId,email);
}
function signOut(){ if(S.session) log("sign-out","portal"); S.session=null; S.onb=null; S.stage="portal"; }
function go(stage){
  if(stage==="configure"&&!isAdmin()) return;
  if(stage==="ad"&&!(S.session&&acct()&&acct().status==="ready")) return;
  S.stage=stage; render();
}
function startOnboarding(source){
  S.onb={source,step:0,d:{solution:"data-foundation",org:"",adminName:"",adminEmail:"",spend:5000,users:[],region:"eastus2",tenancy:"multi",management:"self",storage:500,sandbox:"sbx-main",quota:100}};
  S.onbErr=""; S.stage="sales";
}
function salesOrder(){ const d=S.onb.d; const id=d.org.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")||"client";
  return {salesOrderId:"(assigned on confirm)",source:S.onb.source,solution:d.solution,account:{id,name:d.org},admin:{name:d.adminName,email:d.adminEmail},users:d.users,spendLimitUsd:+d.spend,environment:{region:d.region,tenancy:d.tenancy,management:d.management},sandboxes:[{name:d.sandbox,mode:"dedicated",quotaGb:+d.quota}],storageGb:+d.storage,paid:false}; }
function onbValidate(step){
  const d=S.onb.d;
  if(step===1){ if(!d.org.trim()) return "Organisation name is required."; if(!/^\S+@\S+\.\S+$/.test(d.adminEmail)) return "A valid admin email is required."; const id=salesOrder().account.id; if(S.accounts.some(a=>a.id===id)) return "An account with this name already exists."; }
  if(step===2){ if(+d.spend<=0) return "Spending limit must be positive."; if(+d.spend>MAX_SPEND) return `Spending limit above policy maximum ($${MAX_SPEND.toLocaleString()}).`; }
  if(step===4){ if(+d.quota>+d.storage) return "Sandbox quota exceeds storage allocation."; }
  return "";
}

  const so=salesOrder(); so.salesOrderId=nid("so"); so.paid=true; const d=S.onb.d;
  const a={id:so.account.id,name:so.account.name,solution:so.solution,region:d.region,tenancy:d.tenancy,management:d.management,status:"provisioning",domains:[],sandboxes:[],
    users:[{name:d.adminName||d.adminEmail,email:d.adminEmail,role:"admin"},...d.users.map(u=>({name:u.email.split("@")[0],email:u.email,role:u.admin?"admin":"user"}))],
    resources:{spendLimitUsd:+d.spend,storageGb:+d.storage},usage:{spendUsd:0,computeHours:0},datasets:[],created:now().slice(0,10)};
  S.accounts.push(a);

  const o={id:nid("co"),accountId:a.id,kind:"provision",source:S.onb.source==="staff"?"staff":"sales",requestedBy:S.onb.source==="staff"?S.session.email:d.adminEmail,status:"running",validation:{ok:true,errors:[],warnings:[]},changes,created:now(),salesOrder:so,
    jobs:[["Validate sales order","pending"],["Environment setup (ADAzEnvConfig)","pending"],["Service configuration (ADSvcConfig)","pending"],["Jumpstart AD","pending"],["Verify","pending"]]};
  S.orders.unshift(o); log("config-order.created (provision)",o.id,"configgy");
  S.provisioning=o.id; S.stage="provisioning"; S.onb=null;

function parseConfig(text){
  const t=text.toLowerCase(); const ch=[]; let res=null;
  t.split(/\s+and\s+|,|;/).forEach(p=>{ let m;
    if(m=p.match(/add (?:the )?domain\s+(\S+)/)) ch.push({op:"add",target:"domain",id:m[1]});
    else if(m=p.match(/(?:remove|drop|delete) (?:the )?domain\s+(\S+)/)) ch.push({op:"remove",target:"domain",id:m[1]});
    else if(m=p.match(/add (?:a )?sandbox\s+(\S+)(?:\s+(\d+)\s*gb)?/)) ch.push({op:"add",target:"sandbox",name:m[1],mode:"dedicated",quotaGb:+(m[2]||50)});
    else if(m=p.match(/(?:remove|drop|delete) (?:the )?sandbox\s+(\S+)/)) ch.push({op:"remove",target:"sandbox",name:m[1]});
    else if(m=p.match(/(?:spend|budget).*?(\d[\d,]*)/)) (res=res||{}).spendLimitUsd=+m[1].replace(/,/g,"");
    else if(m=p.match(/storage.*?(\d+)/)) (res=res||{}).storageGb=+m[1];
    else if(m=p.match(/(?:add|invite) (?:user )?(\S+@\S+)(?:\s+as\s+(admin|user))?/)) ch.push({op:"add",target:"user",email:m[1],role:m[2]||"user"});
    else if(m=p.match(/(?:remove|delete) (?:user )?(\S+@\S+)/)) ch.push({op:"remove",target:"user",email:m[1]});
    else if(m=p.match(/(?:make|promote)\s+(\S+@\S+)\s+(?:an? )?admin/)) ch.push({op:"set",target:"user",email:m[1],role:"admin"});
  });
  if(res) ch.push({op:"set",target:"resources",value:res});
  return ch;
}
const isConfigIntent=t=>/\b(add|remove|drop|delete|invite|promote)\b.*\b(domain|sandbox|user|admin)\b|\b(spend|budget|storage|quota|limit)\b/i.test(t);
function chatFor(map,id){ return (map[id]=map[id]||[]); }

function configgySay(text){
  const a=acct(); const c=chatFor(S.cfgChat,a.id); c.push({r:"u",t:text});
  const t=text.toLowerCase(); const ch=parseConfig(text);
  if(ch.length){
    const o=createOrder(a,ch,"configgy");
    const list=ch.map(describe).join("\n");
    c.push({r:"a",t:o.status==="pending"?`I drafted ${o.id} for ${a.name}. It passed validation and is waiting for your approval in Config orders.`:`I drafted ${o.id}, but it failed validation:\n- ${o.validation.errors.join("\n- ")}`,
      card:`<div class="mini"><div class="diff">${esc(list).replace(/\n/g,"<br>")}</div><div style="margin-top:6px"><button class="btn ghost sm" data-act="cfgTab" data-v="orders">Open Config orders</button></div></div>`});
    if(o.status==="pending") S.cfgTab="orders";
  } else if(/status|summary|usage|spend/.test(t)){
    const used=a.sandboxes.reduce((n,s)=>n+s.quotaGb,0);
    c.push({r:"a",t:`${a.name}: ${a.status}. ${a.domains.length} domain(s), ${a.sandboxes.length} sandbox(es) using ${used}/${a.resources.storageGb} GB, spend $${a.usage.spendUsd.toLocaleString()} of $${a.resources.spendLimitUsd.toLocaleString()}. ${S.orders.filter(o=>o.accountId===a.id&&o.status==="pending").length} order(s) awaiting approval.`});
  } else {
    c.push({r:"a",t:"I draft config orders for this account; you approve them. Try:\n• add domain readygo-finance\n• add sandbox sbx-2 50gb\n• set spend limit 8000\n• invite x@y.com as admin\n• status\nChain requests with \"and\". For a quick fix, use the dashboard directly."});
  }
}
function adySay(text){
  const a=acct(); const c=chatFor(S.adChat,a.id); c.push({r:"u",t:text});
  if(isConfigIntent(text)){
    const ch=parseConfig(text);
    if(!ch.length){ c.push({r:"a",t:"That sounds like a configuration change. I can't change the environment, but I can ask Configgy. Say it as, for example, \"add domain readygo-healthcare\"."}); return; }
    const o=createOrder(a,ch,"ady",{note:"Raised from AD by "+S.session.email});
    const admins=a.users.filter(u=>u.role==="admin").map(u=>u.email).join(", ");
    c.push({r:"a",t:o.status==="pending"
      ?(isAdmin()?`That's a configuration change, which I can't do from here. I've raised ${o.id} with Configgy; approve it in Configure.`:`That's a configuration change, which needs an admin. I've raised ${o.id} with Configgy and notified ${admins}.`)
      :`I tried to raise a config order but it failed validation:\n- ${o.validation.errors.join("\n- ")}`,
      card:isAdmin()&&o.status==="pending"?`<div class="mini"><button class="btn ghost sm" data-act="goCfgOrders">Open in Configure</button></div>`:""});
    return;
  }
  const t=text.toLowerCase();
  const verb=/profile|ingest|import|load|upload|register/.test(t)?"DATA":/produce|build|pipeline|foundation|run/.test(t)?"PRODUCE":/generate|new model|new metric|package/.test(t)?"GENERATE":/explore|find|show|what|which|how many|metric|insight|pattern|trend/.test(t)?"EXPLORE":null;
  if(!verb){ c.push({r:"a",t:"I'm ADy. Tell me what work you want done and I'll turn it into a work order for the right domain. Examples:\n• profile the retail_orders dataset\n• produce a data foundation from the retail datasets\n• explore which stores drive returns\n• generate a model for weekly demand"}); return; }
  const sol=SOL.find(s=>s.id===a.solution);
  if(!sol.verbs.includes(verb)){ c.push({r:"a",t:`${verb} is not part of your work solution (${sol.name}). An admin can change the solution in Configure.`}); return; }
  const w={id:nid("wo"),accountId:a.id,by:S.session.email,verb,text,status:"queued",result:""};
  S.works.unshift(w); log("work-order.created ("+verb+")",w.id);
  c.push({r:"a",t:`Work order ${w.id} (${verb}) sent to the ${verb==="DATA"?"data":verb==="PRODUCE"?"produce":verb==="EXPLORE"?"explore":"generate"} coordinator. I'll report the results here.`});
  S.adTab=verb.toLowerCase();
  setTimeout(()=>{ w.status="done";
    w.result={DATA:"Domain job results: dataset profiled, 9 columns, 2 quality issues flagged, metadata registered.",PRODUCE:"Domain job results: 2 datasets integrated, 14 entities, 38 transformations logged, audit metadata written.",EXPLORE:"Domain job results: 3 patterns found; returns concentrate in 4 stores; report attached.",GENERATE:"Domain job results: model generated with 2 metrics. Not yet in a domain: adding it to the library is a configuration step (post Dec 1)."}[verb];
    if(verb==="DATA"){ a.datasets.push({name:"dataset_"+(++S.seq.ds),gb:+(Math.random()*20).toFixed(1),src:"import"}); }
    log("work-order.done",w.id,"coordinator"); c.push({r:"a",t:`${w.id}: ${w.result}`}); render(); },1800);
}
function salesySay(text){
  S.salesChat.push({r:"u",t:text}); const t=text.toLowerCase();
  let r="I can tell you what AD can do, how it works, why it's safe, or get you started with an account.";
  if(/account|sign ?up|start|create|get started|onboard|buy|subscribe/.test(t)){ r="Let's get you set up. I'll walk you through six short steps: work solution, account, spending limit, users, environment options, and confirmation."; startOnboarding("sales"); }
  else if(/what is ad|what does ad|what is this/.test(t)) r="AD intelligently automates the safe production and exploration of data. You bring data; AD produces integrated, peered datasets and lets you explore and generate new models, with every step audited.";
  else if(/safe|trust|control|deterministic/.test(t)) r="AD runs deterministic, repeatable work orders. The AI proposes; verified scripts execute. You stay in control of what runs and can see every result.";
  else if(/price|cost|plan|pay/.test(t)) r="There is a single plan. You pay by data volume and compute use, with a spending limit you set. Single-tenant and fully managed options are available as account upgrades.";
  else if(/sign in|log ?in|existing/.test(t)) { r="If you already have an account, sign in; you won't see me again after that."; }
  S.salesChat.push({r:"a",t:r});
}

function renderHeader(){
  const s=S.session, a=s?acct():null, st=S.stage;
  const salesSt = !s ? (st==="sales"||st==="portal"||st==="signin"?"active":"done") : "done";
  const cfgSt = st==="provisioning"||st==="configure"||st==="staff" ? "active" : (s&&isAdmin()&&a&&a.status==="ready")?"avail":(s&&!isAdmin()?"lock off":"off");
  const adSt = st==="ad" ? "active" : (s&&a&&a.status==="ready")?"avail":"off";
  const sub = st==="ad"?`<div class="sub">${["data","produce","explore","generate"].map(k=>`<button class="${S.adTab===k?"on":""}" data-act="adTab" data-v="${k}">${k[0].toUpperCase()+k.slice(1)}</button>`).join("")}</div>`:"";
  $("#timeline").innerHTML=`<div class="n ${salesSt}" data-act="tlSales"><span class="d"></span>Sales <small>Salesy</small></div><span class="seg"></span>
  <div class="n ${cfgSt}" data-act="tlCfg"><span class="d"></span>Configure <small>Configgy</small></div><span class="seg"></span>
  <div class="n ${adSt}" data-act="tlAd"><span class="d"></span>AD <small>ADy</small></div>${sub}`;

}

function orderDetail(o){
  const ed=S.editing===o.id;
  const rows=o.changes.map((c,i)=>{ const cls=c.op==="add"?"a":c.op==="remove"?"r":"c"; let extra="";
    if(ed&&c.target==="sandbox"&&c.op==="add") extra=` quota <input type="number" value="${c.quotaGb}" data-act="editNum" data-i="${i}" data-k="quotaGb"> GB`;
    if(ed&&c.target==="resources"&&c.value.spendLimitUsd!=null) extra=` spend <input type="number" value="${c.value.spendLimitUsd}" data-act="editNum" data-i="${i}" data-k="spendLimitUsd">`;
    return `<div class="${cls}">${esc(describe(c))}${extra}${ed?`<button class="x" data-act="dropChange" data-v="${i}" title="Drop this change">×</button>`:""}</div>`; }).join("");
  return `<div class="card"><h3>${o.id} · ${o.kind} · from ${o.source}${o.requestedBy?" · "+esc(o.requestedBy):""}</h3>${o.note?`<div class="log">${esc(o.note)}</div>`:""}
  <div class="diff" style="margin:8px 0">${rows||'<span class="empty">No changes left.</span>'}</div>
  ${(o.validation?.errors||[]).map(e=>`<div class="err">✕ ${esc(e)}</div>`).join("")}${(o.validation?.warnings||[]).map(e=>`<div class="warn">! ${esc(e)}</div>`).join("")}
  ${o.status==="pending"?`<div class="note">Awaiting your approval.</div><div class="row"><button class="btn" data-act="approve" data-v="${o.id}">Approve and apply</button>${ed?`<button class="btn ghost" data-act="doneEdit">Done editing</button>`:`<button class="btn ghost" data-act="edit" data-v="${o.id}">Edit changes</button>`}<button class="btn red" data-act="reject" data-v="${o.id}">Reject</button></div>`:""}
  ${o.status==="invalid"?`<div class="row"><button class="btn ghost" data-act="edit" data-v="${o.id}">Edit changes</button><button class="btn" data-act="approve" data-v="${o.id}">Re-validate and apply</button><button class="btn red" data-act="reject" data-v="${o.id}">Reject</button></div>`:""}
  ${o.jobs.length?`<h3 style="margin-top:14px">Jobs</h3><ul class="steps">${o.jobs.map(([n,st])=>`<li><span class="dot ${st==="done"?"done":st==="run"?"run":""}"></span><span>${n} <span class="log">${st==="run"?"running…":st==="done"?"ok":""}</span></span></li>`).join("")}</ul>`:""}
  ${o.salesOrder?`<h3 style="margin-top:14px">Sales order</h3><pre>${esc(JSON.stringify(o.salesOrder,null,2))}</pre>`:""}</div>`;
}

const VIEWS={portal:vPortal,signin:vSignin,sales:vSales,provisioning:vProvisioning,landing:vLanding,staff:vStaff,configure:vConfigure,ad:vAd};
function render(){
  renderHeader(); const app=$("#app"); const scroll=app.querySelector(".page")?.scrollTop||0;
  app.innerHTML=VIEWS[S.stage]();

const g=id=>document.getElementById(id);
const direct=(changes,errKey)=>{ const a=acct(); const o=createOrder(a,changes,"dashboard",{direct:true}); S.cfgErr=o.status==="invalid"?o.validation.errors.join(" "):""; };
const ACT={
  flows:showFlows, closeModal:()=>{$("#modal").hidden=true;}, reset:()=>{S=seed();$("#modal").hidden=true;},
  demo:el=>{const f=FLOWS.find(f=>f.id===el.dataset.v); S.cfgErr=""; S.onbErr=""; f.go(); $("#modal").hidden=true;},
  goSignin:()=>{S.stage="signin";}, signin:el=>signIn(el.dataset.v), signout:signOut,
  startOnb:()=>startOnboarding("sales"), startOnbStaff:()=>startOnboarding("staff"),
  tlSales:()=>{ if(!S.session) S.stage="portal"; else if(!isAdmin()) return; else S.stage="portal"; },
  tlCfg:()=>{ if(S.session&&S.session.role==="staff"&&!S.session.accountId) {S.stage="staff";return;} if(isAdmin()&&acct()&&acct().status==="ready") S.stage="configure"; },
  tlAd:()=>{ if(S.session&&acct()&&acct().status==="ready") S.stage="ad"; },
  goStage:el=>{ const v=el.dataset.v; if(v==="configure"&&!isAdmin()) return; S.stage=v; },
  goCfgOrders:()=>{ if(isAdmin()){S.stage="configure";S.cfgTab="orders";} },
  kTab:el=>{S.kTab=el.dataset.v;}, adTab:el=>{S.adTab=el.dataset.v;}, cfgTab:el=>{S.cfgTab=el.dataset.v;S.cfgErr="";},
  chooseSol:el=>{S.onb.d.solution=el.dataset.v;},
  onbNext:()=>{ S.onbErr=onbValidate(S.onb.step); if(!S.onbErr) S.onb.step++; },
  onbBack:()=>{S.onbErr="";S.onb.step--;}, onbCancel:()=>{S.onb=null;S.stage=S.session?.role==="staff"?"staff":"portal";},
  onbConfirm:()=>{ S.onbErr=[1,2,4].map(onbValidate).find(Boolean)||""; if(!S.onbErr) confirmOnboarding(); },
  onbAddUser:()=>{ const v=g("onbUser").value.trim(); if(!/^\S+@\S+\.\S+$/.test(v)){S.onbErr="Enter a valid email.";return;} if(v===S.onb.d.adminEmail||S.onb.d.users.some(u=>u.email===v)){S.onbErr="Already listed.";return;} S.onbErr=""; S.onb.d.users.push({email:v,admin:false}); },
  onbRmUser:el=>{S.onb.d.users.splice(+el.dataset.v,1);}, onbAdmin:el=>{S.onb.d.users[+el.dataset.v].admin=el.checked;},
  openAccount:el=>{S.session.accountId=el.dataset.v;S.stage="landing";},
  addDomain:()=>direct([{op:"add",target:"domain",id:g("nd").value}]), rmDomain:el=>direct([{op:"remove",target:"domain",id:el.dataset.v}]),
  addSandbox:()=>{ const n=g("ns").value.trim(); if(!n){S.cfgErr="Sandbox name required.";return;} direct([{op:"add",target:"sandbox",name:n,mode:g("nm").value,quotaGb:+g("nq").value}]); },
  rmSandbox:el=>direct([{op:"remove",target:"sandbox",name:el.dataset.v}]),
  addUser:()=>{ const e=g("nu").value.trim(); direct([{op:"add",target:"user",email:e,role:g("nur").value}]); },
  rmUser:el=>direct([{op:"remove",target:"user",email:el.dataset.v}]), setRole:el=>direct([{op:"set",target:"user",email:el.dataset.v,role:el.value}]),
  setRes:()=>direct([{op:"set",target:"resources",value:{spendLimitUsd:+g("rs").value,storageGb:+g("rg").value}}]),
  selOrder:el=>{S.orderId=el.dataset.v;S.editing=null;}, approve:el=>{approve(S.orders.find(o=>o.id===el.dataset.v));return "norender";}, reject:el=>reject(S.orders.find(o=>o.id===el.dataset.v)),
  edit:el=>{S.editing=el.dataset.v;S.orderId=el.dataset.v;}, doneEdit:()=>{S.editing=null;},
  dropChange:el=>{ const o=S.orders.find(o=>o.id===S.editing); o.changes.splice(+el.dataset.v,1); o.validation=validate(acct(o.accountId),o.changes); o.status=o.validation.ok?"pending":"invalid"; log("config-order.edited",o.id); },
  editNum:el=>{ const o=S.orders.find(o=>o.id===S.editing); const c=o.changes[+el.dataset.i]; if(c.target==="resources") c.value[el.dataset.k]=+el.value; else c[el.dataset.k]=+el.value; o.validation=validate(acct(o.accountId),o.changes); o.status=o.validation.ok?"pending":"invalid"; log("config-order.edited",o.id); },
  sugg:el=>sendChat(el.dataset.chat,el.dataset.v)
};
function sendChat(id,text){ if(!text) return; if(id==="salesChat") salesySay(text); else if(id==="cfgChat") configgySay(text); else if(id==="adChat") adySay(text); }
document.body.addEventListener("click",e=>{ const el=e.target.closest("[data-act]"); if(!el) return; if(el.tagName==="SELECT"||el.tagName==="INPUT") return; e.preventDefault(); const r=ACT[el.dataset.act]?.(el); if(r!=="norender") render(); });
document.body.addEventListener("change",e=>{ const el=e.target; if(el.dataset.bind&&S.onb){ S.onb.d[el.dataset.bind]=el.value; return; } if(el.dataset.act&&ACT[el.dataset.act]){ ACT[el.dataset.act](el); render(); } });
document.body.addEventListener("submit",e=>{ e.preventDefault(); const f=e.target; if(!f.dataset.chat) return; const inp=f.querySelector("input"); const v=inp.value.trim(); inp.value=""; sendChat(f.dataset.chat,v); render(); });
render();
</script>
</body>
</html>
